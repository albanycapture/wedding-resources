/* ============================================================
   SCENES — a venue plus its people, and the renderer that turns
   any crop of that scene into an SVG frame.
   ============================================================ */
let UID = 0;

function buildScene(spec) {
  const s = Object.assign({ sx: 1500, gy: 1500, h: 600, time: 'golden', env: 'meadow', opts: {} }, spec);
  if (s.camH == null) { const rg = ENV_CAM[s.env]; s.camH = lerp(rg[0], rg[1], RNG((s.seed ^ 0x51ed) >>> 0)()); }
  const c = makeCtx(s);
  const env = ENVS[s.env](c, s.opts);
  /* the cast uses its own random stream, so changing a venue option never recasts the couple */
  const SR = RNG((s.seed ^ 0xA53C9) >>> 0);
  const sub = Object.assign({ kind: 'couple' }, s.subject);
  const base = Object.assign({}, sub, { R: SR, cx: s.sx, footY: s.gy, h: s.h });
  const made = sub.kind === 'single' ? makeSingle(base) : sub.kind === 'group' ? makeGroup(base) : makeCouple(base);
  const scene = {
    W: WORLD.W, H: WORLD.H, spec: s, hy: c.hy, seed: s.seed, time: s.time,
    defs: env.defs, back: env.back, mid: env.mid, subject: made.svg, front: env.front || '', fg: null,
    people: made.people, group: groupOf(made.people), feats: env.feats, arrangement: made.arrangement,
  };
  if (s.fg) {
    scene.fg = fgLayer(RNG((s.seed ^ 0x77F1) >>> 0), s.fg.frame, s.fg.kind, s.fg.side, c.T);
    scene.feats.fg = scene.fg.boxes;
  }
  return scene;
}

/* Background blur grows as the frame gets tighter, like a long lens up close. */
function dofSigma(scene, crop) {
  if (!scene.group) return 0;
  const ratio = crop.h / scene.group.h;
  return scene.group.h * clamp((1.02 - ratio) * 0.024, 0, 0.017);
}

/* Inner markup of a frame. opts: { tilt (deg), dof (false = sharp), region (rect the blur must cover) } */
function sceneMarkup(scene, crop, opts) {
  const o = opts || {};
  const pre = 'f' + (++UID) + '-';
  let defs = scene.defs || '';
  let bg = (scene.back || '') + (scene.mid || '');
  const sig = o.dof === false ? 0 : dofSigma(scene, crop);
  const reg = o.region || crop;
  if (sig > 0.7) {
    const m = sig * 3 + 80;
    defs += `<filter id="§dof" filterUnits="userSpaceOnUse" x="${r1(reg.x - m)}" y="${r1(reg.y - m)}" width="${r1(reg.w + 2 * m)}" height="${r1(reg.h + 2 * m)}"><feGaussianBlur stdDeviation="${r1(sig)}"/></filter>`;
    bg = `<g filter="url(#§dof)">${bg}</g>`;
  }
  let fg = '';
  if (scene.fg) {
    const f = scene.fg, m = f.sigma * 3 + 40;
    defs += `<filter id="§fg" filterUnits="userSpaceOnUse" x="${r1(reg.x - m - 300)}" y="${r1(reg.y - m - 300)}" width="${r1(reg.w + 2 * m + 600)}" height="${r1(reg.h + 2 * m + 600)}"><feGaussianBlur stdDeviation="${r1(f.sigma)}"/></filter>`;
    fg = `<g filter="url(#§fg)" opacity="${f.opacity}">${f.svg}</g>`;
  }
  let inner = bg + (scene.subject || '') + (scene.front || '') + fg;
  if (o.tilt) inner = `<g transform="rotate(${o.tilt} ${r1(crop.x + crop.w / 2)} ${r1(crop.y + crop.h / 2)})">${inner}</g>`;
  return (`<defs>${defs}</defs>` + inner).split('§').join(pre);
}

function frameSVG(scene, crop, opts) {
  const o = opts || {};
  return `<svg class="shot${o.cls ? ' ' + o.cls : ''}" xmlns="http://www.w3.org/2000/svg" viewBox="${r1(crop.x)} ${r1(crop.y)} ${r1(crop.w)} ${r1(crop.h)}" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">${sceneMarkup(scene, crop, o)}<g class="ov">${o.overlay || ''}</g></svg>`;
}

/* ============================================================
   JUDGING — what each edge of a crop does to the people in it.
   Used three ways: to build frames with exactly one fault, to
   prove a "clean" frame really is clean, and to score the
   player's own crops.
   ============================================================ */
const CROPS = [
  { key: 'wide', name: 'Wide', sub: 'the place is the subject' },
  { key: 'full', name: 'Full-length', sub: 'head to toe' },
  { key: 'threeq', name: 'Three-quarter', sub: 'ends mid-thigh' },
  { key: 'waist', name: 'Waist-up', sub: 'ends below the waist' },
  { key: 'tight', name: 'Tight', sub: 'head and shoulders' },
  { key: 'detail', name: 'Detail', sub: 'no faces, just the thing' },
];
const DEVICES = [
  { key: 'thirds', name: 'Rule of thirds', sub: 'subject on a third line' },
  { key: 'symmetry', name: 'Symmetry', sub: 'mirrored around the centre' },
  { key: 'lines', name: 'Leading lines', sub: 'lines run to the subject' },
  { key: 'frame', name: 'Frame in frame', sub: 'an opening around them' },
  { key: 'space', name: 'Negative space', sub: 'small subject, big empty' },
  { key: 'layers', name: 'Layering', sub: 'soft foreground in front' },
];
const cropName = k => (CROPS.find(c => c.key === k) || {}).name || k;
const deviceName = k => (DEVICES.find(c => c.key === k) || {}).name || k;
const BAND_PRI = { face: 4, joint: 3, clip: 2, tangent: 1 };
/* Bottom-edge ranges (fraction of body height) that read as each crop. */
const CROP_RANGE = { tight: [0.2, 0.335], waist: [0.385, 0.478], threeq: [0.565, 0.69] };

function zoneName(p, y) {
  const u = (y - p.ty) / p.h;
  if (u < 0.2) return 'the shoulders';
  if (u < 0.345) return 'mid-chest';
  if (u < 0.485) return 'just below the waist';
  if (u < 0.69) return 'mid-thigh';
  if (u < 0.92) return 'mid-shin';
  return 'below the feet';
}

function inspectCrop(scene, crop) {
  const yt = crop.y, yb = crop.y + crop.h, xl = crop.x, xr = crop.x + crop.w;
  const out = { top: [], bottom: [], left: [], right: [], inside: [], outside: [] };
  for (const p of scene.people) {
    const b = p.box;
    if (b.x + b.w <= xl + 1 || b.x >= xr - 1 || p.top >= yb - 1 || p.footY <= yt + 1) { out.outside.push(p); continue; }
    out.inside.push(p);
    const vy0 = Math.max(yt, p.top), vy1 = Math.min(yb, p.footY);
    const tol = 0.006 * p.h;
    const headIn = p.head.x >= xl + 0.01 * p.h && p.head.x + p.head.w <= xr - 0.01 * p.h;
    const tightish = yb < p.y(0.34);
    for (const sd of ['left', 'right']) {
      const x = sd === 'left' ? xl : xr;
      const hit = {};
      let any = false;
      for (const part of p.parts) {
        if (part.y1 <= vy0 || part.y0 >= vy1) continue;
        if (x > part.x0 + tol && x < part.x1 - tol) { hit[part.k] = true; any = true; }
      }
      if (!any) continue;
      let f;
      if (hit.head) f = { kind: 'slice', label: 'a head', bad: true };
      else if (hit.bouquet) f = { kind: 'clip', label: 'the bouquet', bad: true };
      else if (hit.hand) f = { kind: 'clip', label: 'a hand', bad: true };
      else if (hit.elbow) f = { kind: 'joint', label: 'an elbow', bad: true };
      else if (hit.wrist) f = { kind: 'joint', label: 'a wrist', bad: true };
      else if (hit.torso || hit.skirt || hit.legs || hit.neck || hit.feet) f = { kind: 'slice', label: headIn ? 'a shoulder' : 'a person', bad: !(tightish && headIn) };
      else f = { kind: 'slice', label: 'an arm', bad: !(tightish && headIn) };
      f.p = p; f.x = x;
      out[sd].push(f);
    }

function resultWords(level, res, stars) {
  const k = `${res.keepers} of ${res.total} keepers`;

  }
  if (level.mode === 'timed') {

    return [stars === 3 ? 'Three stars.' : 'Passed.', `${res.keepers} keepers in ${level.seconds} seconds at ${pct(res.acc)}.${stars === 1 ? ` ${level.need + 4} earns the second star.` : stars === 2 ? ` ${level.need + 8} at 90% earns the third.` : ''}`];
  }

    return [stars === 3 ? 'Three stars.' : 'Passed.', `${k} (${pct(res.acc)}).${stars === 1 ? ' 90% earns the second star.' : stars === 2 ? ' 95% earns the third.' : ''}`];

/* ============================================================
   CROP LAB — practise on your own photos.
   Nothing leaves this browser: each photo is resized here and kept
   in this device's own storage, so it is there next time.
   ============================================================ */
const LAB_RATIOS = [['4:5', 0.8], ['1:1', 1], ['9:16', 9 / 16], ['16:9', 16 / 9], ['5:7', 5 / 7], ['2:3', 2 / 3], ['3:2', 1.5], ['2:1', 2]];

const labAspect = key => LAB_RATIOS.find(r => r[0] === key)[1];

function labOpenDB() {
  return new Promise(resolve => {
    try {
      const rq = window.indexedDB.open('frame-sense-lab', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('photos', { keyPath: 'id' }); };
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => resolve(null);
      rq.onblocked = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
function labPut(p) {
  if (!Lab.db) return;
  try { Lab.db.transaction('photos', 'readwrite').objectStore('photos').put({ id: p.id, w: p.w, h: p.h, blob: p.blob, subject: p.subject, crops: p.crops }); } catch (e) { /* storage full or blocked */ }
}
function labDel(id) {
  if (!Lab.db) return;
  try { Lab.db.transaction('photos', 'readwrite').objectStore('photos').delete(id); } catch (e) { /* ignore */ }
}
async function labLoad() {
  if (Lab.loaded) return;
  Lab.loaded = true;
  Lab.db = await labOpenDB();
  if (!Lab.db) return;
  const rows = await new Promise(resolve => {
    try {
      const rq = Lab.db.transaction('photos', 'readonly').objectStore('photos').getAll();
      rq.onsuccess = () => resolve(rq.result || []);
      rq.onerror = () => resolve([]);
    } catch (e) { resolve([]); }
  });
  for (const r of rows) {
    if (!r || !r.blob) continue;
    Lab.photos.push({ id: r.id, w: r.w, h: r.h, blob: r.blob, url: URL.createObjectURL(r.blob), subject: r.subject || null, crops: r.crops || {} });
  }
}
function labDecode(file) {
  const viaImg = () => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
  return window.createImageBitmap ? window.createImageBitmap(file).catch(viaImg) : viaImg();
}
async function labAddFiles(files) {
  let added = 0, failed = 0;
  for (const f of Array.from(files || []).slice(0, 24)) {
    try {
      const bmp = await labDecode(f);
      const bw = bmp.naturalWidth || bmp.width, bh = bmp.naturalHeight || bmp.height;
      const s = Math.min(1, 1800 / Math.max(bw, bh)), w = Math.round(bw * s), h = Math.round(bh * s);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
      const blob = await new Promise(resolve => cv.toBlob(resolve, 'image/jpeg', 0.88));
      if (!blob) throw new Error('encode');
      const p = { id: 'p' + Date.now() + '-' + Math.floor(Math.random() * 1e6), w, h, blob, url: URL.createObjectURL(blob), subject: null, crops: {} };
      Lab.photos.push(p);
      labPut(p);
      added++;
    } catch (e) { failed++; }
  }
  if (failed) toast(failed === 1 ? 'One file could not be read. Export it as a JPEG and try again.' : failed + ' files could not be read. Export them as JPEGs and try again.');
  if (added) { Lab.cur = Lab.photos.length - added; renderLab(); }
}

/* A rough score from the one thing the game knows about your photo: the box you drew. */
function scorePhotoCrop(p, c, a) {
  const S = p.subject, notes = [];
  const maxW = Math.min(p.w, p.h * a), maxH = maxW / a;
  const ix = Math.max(0, Math.min(rRight(S), rRight(c)) - Math.max(S.x, c.x)), iy = Math.max(0, Math.min(rBottom(S), rBottom(c)) - Math.max(S.y, c.y));
  const cover = (ix * iy) / (S.w * S.h), whole = cover > 0.985, canFit = S.w <= maxW && S.h <= maxH;
  if (cover < 0.02) return { score: 0, notes: [note(false, 'Your subject is outside this crop. Move the box over them.', 0, 100)] };
  if (whole) notes.push(note(true, 'Your subject is whole.', 40, 40));
  else if (!canFit) notes.push(note('part', `This ratio cannot hold the whole subject from this frame. Your crop keeps ${Math.round(cover * 100)}% of it.`, 40 * cover, 40));
  else notes.push(note(false, `The crop cuts into your subject and keeps ${Math.round(cover * 100)}% of it.`, 40 * Math.max(0, cover - 0.5), 40));
  const m = Math.min(S.x - c.x, rRight(c) - rRight(S), S.y - c.y, rBottom(c) - rBottom(S)) / Math.min(c.w, c.h);
  notes.push(!whole ? note(false, 'No room to breathe on at least one side.', 0, 20) : m >= 0.03 ? note(true, 'Room on every side.', 20, 20) : note('part', 'The subject is pressed against an edge.', 20 * clamp(m / 0.03, 0, 1), 20));
  const dx = (S.x + S.w / 2 - (c.x + c.w / 2)) / c.w, ax = Math.abs(dx);
  if (ax <= 0.06) notes.push(note(true, 'Centred.', 25, 25));
  else if (Math.abs(ax - 1 / 6) <= 0.04) notes.push(note(true, `On the ${dx < 0 ? 'left' : 'right'} third.`, 25, 25));
  else notes.push(note('part', `Neither centred nor on a third. The subject sits ${Math.round(ax * 100)}% off centre.`, 25 * clamp(1 - Math.min(ax - 0.06, Math.abs(ax - 1 / 6) - 0.04) / 0.09, 0, 1), 25));
  const hr = (S.y - c.y) / c.h;
  notes.push(hr >= 0.03 && hr <= 0.22 ? note(true, `Headroom is ${Math.round(hr * 100)}% of the frame.`, 15, 15)
    : hr < 0.03 ? note('part', 'Headroom is tight.', 9 * clamp(hr / 0.03, 0, 1), 15)
      : note('part', `Headroom is heavy at ${Math.round(hr * 100)}% of the frame.`, 15 * clamp(1 - (hr - 0.22) / 0.2, 0, 1), 15));
  return { score: sumNotes(notes), notes };
}
function labCheck() {
  const p = Lab.photos[Lab.cur];
  if (!p || !Lab.tool) return;
  labKeep();
  if (!p.subject) { renderLabConsole(`<p class="muted">Draw a box around your subject first. Tap Mark subject.</p>`); return; }
  const res = scorePhotoCrop(p, Lab.tool.value(), labAspect(Lab.ratio));
  renderLabConsole(`<div class="scoreline"><b>${res.score}</b><span class="muted">of 100. A rough check, based on the box you drew.</span></div>` + notesHTML(res.notes));
  layoutLab();
}
function labMark() {
  const p = Lab.photos[Lab.cur];
  if (!p) return;
  labKeep();
  if (Lab.tool) { Lab.tool.destroy(); Lab.tool = null; }
  byId('labConsole').innerHTML = `<div class="ask"><div class="ask-text">Drag a box around your subject<small>Head to toe, or as much of them as the frame holds.</small></div><div class="row"><button type="button" class="btn" id="labMarkCancel">Cancel</button></div></div>`;
  Lab.drawing = drawRect(byId('labHost'), rect(0, 0, p.w, p.h), r => {
    p.subject = r; Lab.drawing = null;
    labPut(p); labMountTool(); renderLabConsole(); layoutLab();
  });
  layoutLab();
}
function labMarkCancel() {
  if (Lab.drawing) { Lab.drawing.cancel(); Lab.drawing = null; }
  labMountTool(); renderLabConsole(); layoutLab();
}
function labSheet() {
  const p = Lab.photos[Lab.cur];
  if (!p) return;
  labKeep();
  const img = byId('labHost').querySelector('img');
  renderLabConsole(`<div class="sheet-out" id="sheetOut"></div>`);
  const out = byId('sheetOut');
  for (const key of SHEET_RATIOS) {
    const a = labAspect(key), set = p.crops[key];
    let c = set;
    if (!c) {
      const w = Math.min(p.w, p.h * a), h = w / a;
      const cx = p.subject ? p.subject.x + p.subject.w / 2 : p.w / 2, cy = p.subject ? p.subject.y + p.subject.h / 2 : p.h / 2;
      c = rect(clamp(cx - w / 2, 0, p.w - w), clamp(cy - h / 2, 0, p.h - h), w, h);
    }
    const cv = document.createElement('canvas');
    cv.width = 260; cv.height = Math.round(260 / a);
    try { cv.getContext('2d').drawImage(img, c.x, c.y, c.w, c.h, 0, 0, cv.width, cv.height); } catch (e) { /* image not ready */ }
    const fig = document.createElement('figure'), cap = document.createElement('figcaption');
    cap.textContent = key + (set ? '' : ' · not set yet');
    fig.appendChild(cv); fig.appendChild(cap); out.appendChild(fig);
  }
  layoutLab();
}
function labRemove() {
  const p = Lab.photos[Lab.cur];
  if (!p) return;
  try { URL.revokeObjectURL(p.url); } catch (e) { /* ignore */ }
  labDel(p.id);
  Lab.photos.splice(Lab.cur, 1);
  renderLab();
}
async function openLab() {
  await labLoad();
  show('lab');
  renderLab();
}
function leaveLab() {
  labKeep();
  if (Lab.tool) { Lab.tool.destroy(); Lab.tool = null; }
  if (Lab.drawing) { Lab.drawing.cancel(); Lab.drawing = null; }
  goHome();
}

/* ============================================================
   WIRING — clicks, keys, resizing, and start-up.
   ============================================================ */
function onClick(e) {
  const t = e.target.closest ? e.target.closest('button') : null;
  if (!t || t.disabled) return;
  const run = App.run, d = t.dataset;
  /* drill answers first: they are the hot path */
  if (App.screen === 'drill' && run) {
    if (t.id === 'drillExit') { askLeave(); return; }
    if (t.id === 'btnStay') { stayInRun(); return; }
    if (t.id === 'btnLeave') { leaveRun(); return; }
    if (run.leaving) return;
    if (t.id === 'btnNext' || t.id === 'btnNextMake') { nextStep(); return; }
    if (t.id === 'btnRef') { if (run.tool && run.item.ref) { run.tool.showRect(run.item.ref, 'ct-ref', 'one strong answer'); t.disabled = true; } return; }
    if (t.id === 'btnLock') { if (run.item.kind === 'make') lockCrop(); else answer(); return; }
    if (run.state !== 'asking') return;
    if (d.edge) { answer(d.edge); return; }
    if (d.pick) { answer(d.pick); return; }
    if (d.key && t.classList.contains('opt')) { if (run.item.kind === 'multi') togglePick(d.key); else answer(d.key); }
    return;
  }
  if (d.level) { openLevel(d.level); return; }
  if (d.nav === 'home') { goHome(); return; }
  if (d.again) { if (App.last) startRun(App.last); return; }
  if (d.photo != null) { labKeep(); Lab.cur = Number(d.photo); renderLab(); return; }
  if (d.ratio) { labKeep(); Lab.ratio = d.ratio; labMountTool(); renderLabConsole(); layoutLab(); return; }
  switch (t.id) {
    case 'btnStart': if (App.level) startRun(App.level); break;
    case 'btnGuide': openGuide(); break;
    case 'btnSound':
      P.settings.sound = P.settings.sound === false;
      saveProgress(); renderHome();
      if (P.settings.sound) Sound.shutter();
      break;
    case 'btnWeak': startWeak(); break;
    case 'btnLab': openLab(); break;
    case 'btnOpenAll': P.settings.openAll = !P.settings.openAll; saveProgress(); renderHome(); break;
    case 'btnReset':
      byId('foot').innerHTML = `<span class="confirm">Erase every star and score? <button type="button" id="btnResetYes">Erase</button><button type="button" id="btnResetNo">Keep</button></span>`;
      break;
    case 'btnResetYes': { const keep = P.settings; P = blankProgress(); P.settings = keep; P.settings.openAll = false; saveProgress(); renderHome(); toast('Progress erased.'); break; }
    case 'btnResetNo': renderHome(); break;
    case 'labExit': leaveLab(); break;
    case 'labAdd': case 'labAdd2': byId('labFile').click(); break;
    case 'labCheck': labCheck(); break;
    case 'labMark': labMark(); break;
    case 'labMarkCancel': labMarkCancel(); break;
    case 'labSheet': labSheet(); break;
    case 'labRemove': labRemove(); break;
    default: break;
  }
}

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key, run = App.run;
  if (App.screen === 'drill' && run) {
    if (run.leaving) { if (key === 'Escape') { e.preventDefault(); stayInRun(); } return; }
    if (key === 'Escape') { e.preventDefault(); askLeave(); return; }
    const item = run.item;
    if (run.state === 'feedback') {
      if (key === 'Enter' || key === ' ') { e.preventDefault(); nextStep(); }
      return;
    }
    if (run.state !== 'asking' || !item) return;
    const k = item.kind;
    let val = null;
    if (k === 'pick' || k === 'multi') {
      const i = '123456'.indexOf(key);
      if (i >= 0 && key.length === 1 && i < item.options.length) {
        e.preventDefault();
        if (k === 'multi') togglePick(item.options[i].key); else answer(item.options[i].key);
      } else if (k === 'multi' && key === 'Enter') { e.preventDefault(); answer(); }
      return;
    }
    if (k === 'edge') val = { ArrowUp: 'top', ArrowRight: 'right', ArrowDown: 'bottom', ArrowLeft: 'left', ' ': 'clean', c: 'clean', C: 'clean' }[key];
    else if (k === 'ab') val = { ArrowLeft: 'a', ArrowRight: 'b', ArrowUp: 'a', ArrowDown: 'b', a: 'a', A: 'a', b: 'b', B: 'b', 1: 'a', 2: 'b' }[key];
    else if (k === 'print') val = { f: 'fits', F: 'fits', c: 'cuts', C: 'cuts', 1: 'fits', 2: 'cuts' }[key];
    else if (k === 'make') {
      if (key === 'Enter') { e.preventDefault(); lockCrop(); }
      else if (run.tool) run.tool.key(e);
      return;
    }
    if (val) { e.preventDefault(); answer(val); }
    return;
  }
  if (key === 'Escape') {
    if (App.screen === 'lab') leaveLab();
    else if (App.screen !== 'home') goHome();
    return;
  }
  const tag = e.target && e.target.tagName;
  if (key === 'Enter' && tag !== 'BUTTON' && tag !== 'INPUT') {
    if (App.screen === 'level' && App.level) { e.preventDefault(); startRun(App.level); }
  }
}

function start(saved) {
  loadLocal();
  buildThumbs();
  renderHome();
  show('home');
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  /* after a miss, a tap on the picture moves on (with a short guard against double taps) */
  byId('stage').addEventListener('click', e => {
    const run = App.run;
    if (!run || run.state !== 'feedback' || run.leaving || byId('btnNext').hidden) return;
    if (e.target.closest && e.target.closest('#btnNext, .leave')) return;
    const last = run.log[run.log.length - 1];
    if (last && performance.now() - (run.t0 + last.ms) > 700) nextStep();
  });
  byId('labFile').addEventListener('change', e => { labAddFiles(e.target.files); e.target.value = ''; });
  const ls = byId('labStage');
  ls.addEventListener('dragover', e => { e.preventDefault(); });
  ls.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer) labAddFiles(e.dataTransfer.files); });
  const relayout = () => { layoutFrames(); if (App.screen === 'lab') layoutLab(); };
  if (window.ResizeObserver) { const ro = new ResizeObserver(relayout); ro.observe(byId('stage')); ro.observe(byId('labStage')); }
  window.addEventListener('resize', relayout);
  document.addEventListener('visibilitychange', () => { if (App.run) App.run.lastTick = performance.now(); });
  if (saved && saved.level && levelById(saved.level) && isOpen(levelById(saved.level))) openLevel(saved.level);
  connectSync();
}

/* Dev hook used by the automated checks. Harmless in normal play. */
window.FrameSense = { App, LEVELS, P: () => P, startRun, levelById, makeItem, inspectCrop, faultsOf, RNG, answer, lockCrop, nextStep, finishRun, openLevel, goHome };

/* When the page is republished while someone has it open, come back to the level they were on. */
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ level: App.screen !== 'home' && App.level ? App.level.id : null })); } catch (e) { /* not in a viewer */ }
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});

})();
</script>
