</head>
<body>
<!-- Frame Sense. Generated by build.mjs from the files in src/. Edit those, then run: node build.mjs -->
<title>Frame Sense</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Chivo+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a contact sheet on a light table. One roll of twelve 6x6 frames is the level map;
   a drill is a viewfinder — black stage, frame lines, a data strip underneath. */
:root {
  --bg: #e6e9eb; --surface: #f3f4f5; --raise: #ffffff;
  --ink: #14171a; --ink-2: #474e55; --ink-3: #6f777f; --line: #cbd1d6;
  --film: #101214; --film-2: #1c1f22; --film-ink: #f0b33a; --film-text: #e9ecee; --film-mute: #8f979f;
  --stage: #0c0d0f; --stage-2: #191c1f; --stage-ink: #eceff1; --stage-ink-2: #9ea6ae; --stage-line: #2e3238;
  --marker: #f4b423; --marker-ink: #1b1403; --marker-text: #7a4f00;
  --keep: #167f4f; --keep-bg: #dbf0e4; --miss: #c2332d; --miss-bg: #f8dfdd;
  --keep-hi: #41d28d; --miss-hi: #ff6f69;
  --focus: #14171a;
  --shadow: 0 1px 2px rgba(16, 20, 24, .08), 0 8px 24px rgba(16, 20, 24, .09);
  --font-display: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-data: 'Chivo Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1c1f22; --raise: #25292d;
    --ink: #eceef0; --ink-2: #b0b7be; --ink-3: #858d95; --line: #353b41;
    --film: #07080a; --film-2: #141618; --film-ink: #f0b33a; --film-text: #e9ecee; --film-mute: #8f979f;
    --stage: #07080a; --stage-2: #141618; --stage-ink: #eceff1; --stage-ink-2: #9ea6ae; --stage-line: #2e3238;
    --marker: #f4b423; --marker-ink: #1b1403; --marker-text: #f4b423;
    --keep: #41d28d; --keep-bg: #12301f; --miss: #ff6f69; --miss-bg: #3a1917;
    --keep-hi: #41d28d; --miss-hi: #ff6f69;
    --focus: #f4b423;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1c1f22; --raise: #25292d;
  --ink: #eceef0; --ink-2: #b0b7be; --ink-3: #858d95; --line: #353b41;
  --film: #07080a; --film-2: #141618; --film-ink: #f0b33a; --film-text: #e9ecee; --film-mute: #8f979f;
  --stage: #07080a; --stage-2: #141618; --stage-ink: #eceff1; --stage-ink-2: #9ea6ae; --stage-line: #2e3238;
  --marker: #f4b423; --marker-ink: #1b1403; --marker-text: #f4b423;
  --keep: #41d28d; --keep-bg: #12301f; --miss: #ff6f69; --miss-bg: #3a1917;
  --keep-hi: #41d28d; --miss-hi: #ff6f69;
  --focus: #f4b423;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { height: 100%; }
.screen { height: 100%; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.wrap { max-width: 1180px; margin-inline: auto; padding-left: var(--gut-l); padding-right: var(--gut-r); padding-block: 18px 40px; }

/* ---------- type ---------- */
.label { font: 600 11px/1.2 var(--font-display); font-stretch: 82%; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.h-display { font: 800 clamp(28px, 5vw, 44px)/1.02 var(--font-display); font-stretch: 112%; letter-spacing: -.015em; text-wrap: balance; }
.h-2 { font: 750 20px/1.15 var(--font-display); font-stretch: 106%; letter-spacing: -.005em; text-wrap: balance; }
.lede { font-size: 16px; color: var(--ink-2); max-width: 62ch; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 9px 16px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--raise); color: var(--ink);
  font: 650 14.5px/1.1 var(--font-body); white-space: nowrap;
  transition: transform .08s ease, background-color .12s ease, border-color .12s ease;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--marker); color: var(--marker-ink); border-color: transparent; font-weight: 750; }
.btn-primary:hover { border-color: transparent; filter: brightness(1.05); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 10px; }
.btn-quiet:hover { background: var(--surface); border-color: transparent; color: var(--ink); }
.btn[disabled] { opacity: .45; }
.btn kbd, .opt kbd, .hintkey {
  font: 500 11px/1 var(--font-data); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .55;
}
@media (hover: none) { .btn kbd, .opt kbd, .hintkey, .keys-only { display: none !important; } }

/* ---------- home ---------- */
.mast { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand h1 { font: 850 clamp(17px, 4.7vw, 21px)/1 var(--font-display); font-stretch: 122%; letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
.mast-tools { display: flex; gap: 2px; margin-right: -8px; }
.mast-tools .btn { padding-inline: 9px; }

.sheet { background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 14px; box-shadow: var(--shadow); min-width: 0; container: sheet / inline-size; margin-block: 16px; }
.strips { display: grid; gap: 12px 14px; grid-template-columns: minmax(0, 1fr); }
@container sheet (min-width: 820px) { .strips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 0 2px 10px; }
.sheet-head .data { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
.strip-name { display: flex; gap: 8px; align-items: baseline; padding: 0 2px 5px; }
.strip-name b { font: 800 12px/1 var(--font-display); font-stretch: 86%; letter-spacing: .12em; text-transform: uppercase; }
.strip-name span { font-size: 12.5px; color: var(--ink-3); }
.strip { background: var(--film); border-radius: 3px; padding: 0 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 8px; }
.fr { display: grid; grid-template-rows: auto auto auto; text-align: left; color: var(--film-text); border-radius: 2px; min-width: 0; padding: 0; }
.fr:focus-visible { outline-color: var(--marker); outline-offset: 1px; }
.fr-edge { display: flex; justify-content: space-between; align-items: center; height: 22px; font: 500 10px/1 var(--font-data); color: var(--film-ink); letter-spacing: .06em; white-space: nowrap; overflow: hidden; }
.fr-edge i { font-style: normal; opacity: .55; }
.fr-img { position: relative; aspect-ratio: 1; background: var(--film-2); overflow: hidden; max-width: 100%; }
.fr-img svg { width: 100%; height: 100%; transition: transform .25s ease; }
.fr:not(.is-locked):hover .fr-img svg { transform: scale(1.04); }
.fr-cap { display: flex; flex-direction: column; gap: 3px; padding: 6px 0 9px; min-height: 44px; min-width: 0; }
.fr-cap b { font: 700 11.5px/1.15 var(--font-display); font-stretch: 84%; letter-spacing: .07em; text-transform: uppercase; overflow-wrap: anywhere; }
.stars { font-size: 12px; letter-spacing: 2px; color: var(--film-ink); line-height: 1; white-space: nowrap; }
.stars .off { opacity: .28; }
.fr.is-locked .fr-img svg { opacity: .3; filter: grayscale(1); }
.fr.is-locked .fr-cap b, .fr.is-locked .fr-edge { color: var(--film-mute); }
.fr.is-locked { cursor: default; }
.fr-lock { position: absolute; inset: 0; display: grid; place-items: center; color: var(--film-mute); }
.fr-lock svg { width: 22px; height: 22px; opacity: 1 !important; filter: none !important; transform: none !important; }
.fr.is-next .fr-img { box-shadow: 0 0 0 2px var(--marker); }
.fr-next { position: absolute; left: 0; top: 0; background: var(--marker); color: var(--marker-ink); font: 800 10px/1 var(--font-display); font-stretch: 84%; letter-spacing: .1em; padding: 4px 6px 3px; text-transform: uppercase; }

.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.card > .label { display: block; margin-bottom: 8px; }
.next-up { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 24px; align-items: center; }
.next-up .num { font: 500 12.5px/1 var(--font-data); color: var(--ink-3); letter-spacing: .03em; }
.next-up h2 { margin: 5px 0 3px; }
.next-up p { color: var(--ink-2); max-width: 62ch; }
.next-up .go { display: grid; gap: 6px; justify-items: end; text-align: right; }
.next-up .goal { font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 640px) { .next-up { grid-template-columns: minmax(0, 1fr); } .next-up .go { justify-items: stretch; text-align: left; } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat b { display: block; font: 600 22px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-3); }
.weak li { display: grid; grid-template-columns: minmax(0, 1fr) 70px 38px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13.5px; }
.weak .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.weak .bar i { display: block; height: 100%; background: var(--miss); }
.weak .data { font-size: 12px; color: var(--ink-3); text-align: right; }
.muted { color: var(--ink-3); font-size: 13.5px; }
.card .btn { margin-top: 12px; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding-top: 14px; font-size: 12.5px; color: var(--ink-3); }
.foot button { text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); min-height: 32px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- level brief + guide ---------- */
.crumb { display: flex; align-items: center; gap: 8px; padding-bottom: 14px; }
.level-head { display: grid; gap: 8px; padding-bottom: 18px; }
.level-head .num { font: 500 13px/1 var(--font-data); color: var(--ink-3); letter-spacing: .04em; }
.brief-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(260px, .9fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .brief-grid { grid-template-columns: minmax(0, 1fr); } }
.plate { background: var(--stage); border-radius: 4px; padding: 14px; color: var(--stage-ink); min-width: 0; }
.plate svg { width: 100%; height: auto; }
.plate-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .plate-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.plate-grid figure { min-width: 0; }
.plate-grid figcaption { padding-top: 5px; font: 650 11.5px/1.2 var(--font-display); font-stretch: 86%; letter-spacing: .07em; text-transform: uppercase; }
.plate-grid figcaption i { display: block; font: 400 11.5px/1.3 var(--font-body); font-stretch: 100%; letter-spacing: 0; text-transform: none; color: var(--stage-ink-2); padding-top: 2px; }
.plate-grid .thumb { aspect-ratio: 3 / 2; background: #000; overflow: hidden; }
.plate-grid .thumb svg { width: 100%; height: 100%; }
.rules { display: grid; gap: 9px; }
.rules li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; color: var(--ink-2); }
.rules li::before { content: ''; width: 6px; height: 6px; margin-top: 8px; background: var(--marker); }
.rules b { color: var(--ink); font-weight: 650; }
.targets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.targets div { border-top: 2px solid var(--ink); padding-top: 7px; min-width: 0; }
.targets b { display: block; font: 600 17px/1.15 var(--font-data); }
.targets span { font-size: 12px; color: var(--ink-3); }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th { text-align: left; font: 600 11px/1.2 var(--font-display); font-stretch: 82%; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 0 8px 6px 0; }
.table td { padding: 6px 8px 6px 0; border-top: 1px solid var(--line); }
.table td.data { font-size: 12.5px; white-space: nowrap; }
.guide-sec { padding: 22px 0; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.guide-sec:first-of-type { border-top: 0; padding-top: 4px; }

/* ---------- drill ---------- */
.screen.drill, .screen.lab { display: flex; flex-direction: column; overflow: hidden; background: var(--stage); }
.bar { flex: none; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px var(--gut-r) 4px var(--gut-l); background: var(--stage); color: var(--stage-ink); border-bottom: 1px solid var(--stage-line); }
.bar .x { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 6px; color: var(--stage-ink-2); flex: none; margin-left: -8px; }
.bar .x:hover { color: var(--stage-ink); background: var(--stage-2); }
.bar :focus-visible { outline-color: var(--marker); }
.bar-title { min-width: 0; display: flex; flex-direction: column; gap: 5px; margin-right: auto; }
.bar-title b { font: 750 13px/1 var(--font-display); font-stretch: 86%; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pips { display: flex; gap: 3px; flex-wrap: nowrap; }
.pip { width: 9px; height: 5px; background: var(--stage-line); border-radius: 1px; flex: none; }
.pip.k { background: var(--keep-hi); } .pip.m { background: var(--miss-hi); } .pip.now { background: var(--marker); }
.readout { display: flex; gap: 14px; align-items: center; flex: none; }
.readout div { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.readout b { font: 600 15px/1 var(--font-data); font-variant-numeric: tabular-nums; }
.readout span { font: 600 9.5px/1 var(--font-display); font-stretch: 82%; letter-spacing: .1em; text-transform: uppercase; color: var(--stage-ink-2); }
.readout .clock b { font-size: 19px; color: var(--marker); }
.readout .clock.low b { color: var(--miss-hi); }
@media (max-width: 460px) { .readout .opt-stat { display: none; } }

.stage { flex: 1 1 auto; min-height: 0; position: relative; background: var(--stage); overflow: hidden; }
.frames { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.frames.col { flex-direction: column; }
.frame { position: relative; flex: none; background: #000; box-shadow: 0 0 0 1px rgba(255, 255, 255, .16); max-width: 100%; }
.frame > svg { width: 100%; height: 100%; }
button.frame { cursor: pointer; }
button.frame:hover { box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }
button.frame:focus-visible { outline-color: var(--marker); outline-offset: 3px; }
.frame-tag { position: absolute; left: 8px; top: 8px; font: 600 12px/1 var(--font-data); color: #fff; background: rgba(0, 0, 0, .6); padding: 4px 7px; border-radius: 3px; pointer-events: none; }
.frame.is-good { box-shadow: 0 0 0 3px var(--keep-hi); }
.frame.is-bad { box-shadow: 0 0 0 3px var(--miss-hi); }
.frame.flash-k { animation: flashK .5s ease-out; }
.frame.flash-m { animation: flashM .5s ease-out; }
@keyframes flashK { 0% { box-shadow: 0 0 0 5px var(--keep-hi); } 100% { box-shadow: 0 0 0 1px rgba(255, 255, 255, .16); } }
@keyframes flashM { 0% { box-shadow: 0 0 0 5px var(--miss-hi); } 100% { box-shadow: 0 0 0 1px rgba(255, 255, 255, .16); } }

/* edge patrol: the frame's own edges are the buttons */
.edge-zone { position: absolute; z-index: 2; }
.edge-zone[data-edge="top"] { inset: -14px 0 auto 0; height: calc(24% + 14px); }
.edge-zone[data-edge="bottom"] { inset: auto 0 -14px 0; height: calc(24% + 14px); }
.edge-zone[data-edge="left"] { inset: 24% auto 24% -14px; width: calc(24% + 14px); }
.edge-zone[data-edge="right"] { inset: 24% -14px 24% auto; width: calc(24% + 14px); }
.edge-zone::before { content: ''; position: absolute; background: rgba(255, 255, 255, .38); border-radius: 3px; transition: background-color .1s ease, transform .1s ease; }
.edge-zone[data-edge="top"]::before { top: 3px; left: 50%; width: 54px; height: 5px; margin-left: -27px; }
.edge-zone[data-edge="bottom"]::before { bottom: 3px; left: 50%; width: 54px; height: 5px; margin-left: -27px; }
.edge-zone[data-edge="left"]::before { left: 3px; top: 50%; width: 5px; height: 54px; margin-top: -27px; }
.edge-zone[data-edge="right"]::before { right: 3px; top: 50%; width: 5px; height: 54px; margin-top: -27px; }
.edge-zone::after { content: ''; position: absolute; inset: 14px 0 0 0; opacity: 0; transition: opacity .1s ease; }
.edge-zone[data-edge="top"]::after { inset: 14px 0 0 0; background: linear-gradient(to bottom, rgba(244, 180, 35, .5), rgba(244, 180, 35, 0)); }
.edge-zone[data-edge="bottom"]::after { inset: 0 0 14px 0; background: linear-gradient(to top, rgba(244, 180, 35, .5), rgba(244, 180, 35, 0)); }
.edge-zone[data-edge="left"]::after { inset: 0 0 0 14px; background: linear-gradient(to right, rgba(244, 180, 35, .5), rgba(244, 180, 35, 0)); }
.edge-zone[data-edge="right"]::after { inset: 0 14px 0 0; background: linear-gradient(to left, rgba(244, 180, 35, .5), rgba(244, 180, 35, 0)); }
.edge-zone:hover::before, .edge-zone:focus-visible::before { background: var(--marker); }
.edge-zone:hover::after, .edge-zone:focus-visible::after { opacity: 1; }
.edge-zone:focus-visible { outline: none; }
.edge-zone:disabled { display: none; }

.stage-next { position: absolute; right: var(--gut-r); bottom: 14px; z-index: 4; box-shadow: 0 4px 18px rgba(0, 0, 0, .5); }
.stage-next:focus-visible { outline-color: #fff; }
.leave { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(6, 7, 8, .82); padding: 16px; }
.leave-card { background: var(--raise); color: var(--ink); border-radius: 8px; padding: 18px; max-width: 320px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.leave-card b { font: 750 18px/1.2 var(--font-display); }
.leave-card p { color: var(--ink-2); }

/* overlays drawn inside frames */
.ov-thin { fill: none; stroke: #fff; stroke-opacity: .6; stroke-width: 1; vector-effect: non-scaling-stroke; }
.ov-dash { fill: none; stroke: #fff; stroke-opacity: .8; stroke-width: 1.25; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.ov-acc { fill: none; stroke: var(--marker); stroke-width: 2.25; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.ov-acc-dash { fill: none; stroke: var(--marker); stroke-width: 2; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; }
.ov-good { fill: none; stroke: var(--keep-hi); stroke-width: 2.5; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.ov-bad { fill: none; stroke: var(--miss-hi); stroke-width: 3; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.ov-dim { fill: #050607; fill-opacity: .6; }
.ov-hatch { fill: var(--marker); fill-opacity: .14; stroke: var(--marker); stroke-opacity: .8; stroke-width: 1.25; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.ov-chip { fill: #0a0b0c; fill-opacity: .82; }
.ov-chip.acc { fill: var(--marker); fill-opacity: 1; }
.ov-chip.bad { fill: var(--miss-hi); fill-opacity: 1; }
.ov-chip.good { fill: var(--keep-hi); fill-opacity: 1; }
.ov-text { font-family: var(--font-data); font-weight: 600; fill: #fff; }
.ov-text.dark { fill: #121212; }

/* console: prompt, choices, verdict */
.console { flex: none; background: var(--bg); color: var(--ink); border-top: 1px solid var(--line); max-height: 62%; overflow-y: auto; }
.console-in { max-width: 860px; margin-inline: auto; padding: 12px var(--gut-r) 14px var(--gut-l); display: grid; gap: 10px; }
