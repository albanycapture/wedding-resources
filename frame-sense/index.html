<script>
(() => {
'use strict';
/* ============================================================
   UTILITIES
   ============================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const r1 = v => Math.round(v * 10) / 10;
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Seeded random source. Every scene is built from one seed so the same
   scene can be drawn twice (side-by-side crops) and replayed in tests. */
function RNG(seed) {
  const f = mulberry32(seed);
  const R = () => f();
  R.range = (a, b) => a + (b - a) * f();
  R.int = (a, b) => Math.floor(a + (b - a + 1) * f());
  R.pick = arr => arr[Math.floor(f() * arr.length)];
  R.chance = p => f() < p;
  R.sign = () => (f() < 0.5 ? -1 : 1);
  R.shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(f() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  R.weighted = pairs => {
    let total = 0;
    for (const p of pairs) total += p[1];
    let t = f() * total;
    for (const p of pairs) { t -= p[1]; if (t <= 0) return p[0]; }
    return pairs[pairs.length - 1][0];
  };
  return R;
}
let SEED_COUNTER = (Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0;
const nextSeed = () => (SEED_COUNTER = (SEED_COUNTER + 0x9E3779B9) >>> 0);

/* ---- colour ---- */
function hex2rgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgb2hex(r, g, b) {
  return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
const shade = (c, t) => (t >= 0 ? mix(c, '#ffffff', t) : mix(c, '#000000', -t));

/* ---- rectangles: {x, y, w, h} ---- */
const rect = (x, y, w, h) => ({ x, y, w, h });
const rRight = r => r.x + r.w;
const rBottom = r => r.y + r.h;
const rInset = (r, d) => rect(r.x + d, r.y + d, r.w - 2 * d, r.h - 2 * d);
function rUnion(a, b) {
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return rect(x, y, Math.max(rRight(a), rRight(b)) - x, Math.max(rBottom(a), rBottom(b)) - y);
}
const rContains = (outer, inner, pad = 0) =>
  inner.x >= outer.x + pad && inner.y >= outer.y + pad &&
  rRight(inner) <= rRight(outer) - pad && rBottom(inner) <= rBottom(outer) - pad;
const fmtPct = v => Math.round(v * 100) + '%';

/* ============================================================
   FIGURES — stylised people with known anatomy.
   Every figure reports where its joints, hands and head are, so the
   game can build crops on purpose and judge the player's crops.
   All measurements are fractions of the figure's height, measured
   down from the top of the head.
   ============================================================ */
const SKIN = ['#F3CDAE', '#E8B892', '#D29C70', '#B37C51', '#8C5B39', '#623D28'];
const HAIR = ['#2B1E18', '#4B3123', '#6E4A2C', '#A9793F', '#D0A85E', '#1C1C22', '#8C3E22', '#9E9C98'];
const SUITS = ['#24324D', '#2E3136', '#3B4A3F', '#5B2A33', '#4C607A', '#1D1E22', '#7F858D', '#A98F6A'];
const GOWNS = ['#FBF7EE', '#FFFFFF', '#F5EBDB', '#F9E9E3'];
const DRESSES = ['#9DB09A', '#8FA9C4', '#E0AFA8', '#7A3B46', '#D1A545', '#C6765B', '#6E7FA8', '#B8A1C9'];
const FLOWERS = [
  ['#F6D5CF', '#FFFFFF', '#E7A9A0', '#C9828A'],
  ['#FFFFFF', '#F3E3B5', '#F7C8A0', '#E9967A'],
  ['#E9D7F0', '#FFFFFF', '#B79AD0', '#8F6FB0'],
  ['#FFFFFF', '#F4EEDF', '#DCE6D2', '#F0C9C9'],
  ['#F5B8A6', '#F7DCC2', '#D9695F', '#A7354B'],
];
const LEAF = ['#5F7D55', '#7A9668', '#4C6A47'];

const BODY = {
  chin: 0.126, neck: 0.15, shoulder: 0.176, chest: 0.25, elbow: 0.358, waist: 0.388,
  hip: 0.47, crotch: 0.505, wrist: 0.495, fingertip: 0.562, midThigh: 0.622,
  knee: 0.725, midShin: 0.835, ankle: 0.945, feet: 1,
};
/* Where a frame edge can land cleanly, by crop name. */
const CUT = { tight: 0.278, waist: 0.432, threeq: 0.622, shin: 0.835 };

/* Arm poses: elbow, wrist and fingertip for side s (-1 = viewer's left). */
const ARM_POSE = {
  down:    (s, w) => ({ el: [s * (w + 0.026), 0.358], wr: [s * (w + 0.031), 0.495], tip: [s * (w + 0.033), 0.562] }),
  akimbo:  (s, w) => ({ el: [s * (w + 0.11), 0.338], wr: [s * (w + 0.02), 0.442], tip: [s * (w - 0.004), 0.47] }),
  pocket:  (s, w) => ({ el: [s * (w + 0.05), 0.362], wr: [s * (w + 0.012), 0.468], tip: null }),
  bouquet: (s, w) => ({ el: [s * (w + 0.03), 0.345], wr: [s * 0.036, 0.428], tip: [s * 0.012, 0.442] }),
  hold:    (s, w) => ({ el: [s * (w + 0.04), 0.365], wr: [s * (w + 0.086), 0.492], tip: [s * (w + 0.113), 0.538] }),
};

function bouquetSVG(x, y, r, pal, R) {
  let s = '';
  const n = 7;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + R.range(-0.2, 0.2);
    const lx = x + Math.cos(a) * r * 0.82, ly = y + Math.sin(a) * r * 0.82;
    s += `<ellipse cx="${r1(lx)}" cy="${r1(ly)}" rx="${r1(r * 0.42)}" ry="${r1(r * 0.2)}" transform="rotate(${r1(a * 180 / Math.PI)} ${r1(lx)} ${r1(ly)})" fill="${R.pick(LEAF)}"/>`;
  }
  s += `<path d="M${r1(x - r * 0.12)} ${r1(y + r * 0.5)} L${r1(x - r * 0.2)} ${r1(y + r * 1.75)} M${r1(x + r * 0.1)} ${r1(y + r * 0.5)} L${r1(x + r * 0.16)} ${r1(y + r * 1.7)}" stroke="${LEAF[2]}" stroke-width="${r1(r * 0.16)}" stroke-linecap="round" fill="none"/>`;
  const blooms = [[0, 0, 0.44], [-0.5, -0.22, 0.36], [0.48, -0.25, 0.36], [-0.34, 0.42, 0.34], [0.36, 0.4, 0.35], [0.02, -0.58, 0.3], [-0.72, 0.18, 0.24], [0.74, 0.14, 0.24]];
  blooms.forEach((b, i) => {
    const c = pal[(i + R.int(0, 2)) % pal.length];
    const bx = x + b[0] * r, by = y + b[1] * r, br = b[2] * r;
    s += `<circle cx="${r1(bx)}" cy="${r1(by)}" r="${r1(br)}" fill="${c}"/>`;
    s += `<circle cx="${r1(bx)}" cy="${r1(by)}" r="${r1(br * 0.42)}" fill="${shade(c, -0.14)}" opacity=".65"/>`;
  });
  return s;
}

function figure(o) {
  const h = o.h, cx = o.cx, ty = o.footY - h;
  const X = x => r1(cx + x * h), Y = y => r1(ty + y * h), U = v => r1(v * h);
  const P = (x, y) => X(x) + ' ' + Y(y);
  const pts = arr => arr.map(p => X(p[0]) + ',' + Y(p[1])).join(' ');
  const st = o.style;
  const skin = o.skin, skinD = shade(skin, -0.13), ink = shade(skin, -0.55);
  const col = o.color, colD = shade(col, -0.18), colL = shade(col, 0.1);
  const hair = o.hair, hs = o.hairStyle || 'short';
  const shx = st === 'suit' ? 0.094 : 0.084;
  const armW = st === 'suit' ? 0.048 : 0.036;
  const sleeve = st === 'suit' ? shade(col, -0.08) : skin;
  let back = '', body = '';
  const parts = [], bands = [];
  const part = (k, xa, ya, xb, yb, pad = 0) => parts.push({
    k, x0: cx + (Math.min(xa, xb) - pad) * h, x1: cx + (Math.max(xa, xb) + pad) * h,
    y0: ty + (Math.min(ya, yb) - pad) * h, y1: ty + (Math.max(ya, yb) + pad) * h,
  });
  const band = (ua, ub, kind, label) => bands.push({ y0: ty + ua * h, y1: ty + ub * h, kind, label });

  /* contact shadow */
  back += `<ellipse cx="${X(0)}" cy="${Y(1.004)}" rx="${U(st === 'gown' ? 0.25 : 0.17)}" ry="${U(0.021)}" fill="#000" opacity=".17"/>`;

  /* hair and veil that fall behind the body */
  if (o.veil) {
    back += `<path d="M${P(-0.03, 0.012)} C${P(-0.12, 0.1)} ${P(-0.16, 0.36)} ${P(-0.185, 0.6)} Q${P(0, 0.63)} ${P(0.185, 0.6)} C${P(0.16, 0.36)} ${P(0.12, 0.1)} ${P(0.03, 0.012)} Z" fill="#fff" opacity=".5"/>`;
  }
  if (hs === 'long') {
    back += `<path d="M${P(-0.05, 0.05)} C${P(-0.068, 0.14)} ${P(-0.07, 0.2)} ${P(-0.062, 0.262)} Q${P(0, 0.285)} ${P(0.062, 0.262)} C${P(0.07, 0.2)} ${P(0.068, 0.14)} ${P(0.05, 0.05)} Z" fill="${hair}"/>`;
  }

  /* ---------- lower body ---------- */
  if (st === 'suit') {
    const tr = o.trouser || col, trD = shade(tr, -0.2);
    for (const s of [-1, 1]) {
      body += `<polygon points="${pts([[s * 0.094, 0.46], [s * 0.088, 0.725], [s * 0.083, 0.948], [s * 0.03, 0.948], [s * 0.021, 0.725], [s * 0.003, 0.508], [s * 0.003, 0.46]])}" fill="${tr}"/>`;
      body += `<path d="M${P(s * 0.03, 0.722)} Q${P(s * 0.055, 0.737)} ${P(s * 0.08, 0.722)}" stroke="${trD}" stroke-width="${U(0.006)}" fill="none" stroke-linecap="round" opacity=".75"/>`;
      body += `<path d="M${P(s * 0.028, 0.944)} L${P(s * 0.085, 0.944)} Q${P(s * 0.112, 0.972)} ${P(s * 0.104, 0.999)} L${P(s * 0.03, 0.999)} Z" fill="${o.shoe || '#19191c'}"/>`;
    }
    part('legs', -0.094, 0.5, 0.094, 0.948);
    part('feet', -0.112, 0.948, 0.112, 1);
    band(0.49, 0.526, 'joint', 'the hip line');
    band(0.69, 0.76, 'joint', 'the knees');
    band(0.915, 0.972, 'joint', 'the ankles');
    band(0.972, 1, 'clip', 'the feet');
    band(1, 1.016, 'tangent', 'feet on the frame edge');
  } else if (st === 'dress') {
    for (const s of [-1, 1]) {
      body += `<polygon points="${pts([[s * 0.088, 0.64], [s * 0.086, 0.725], [s * 0.084, 0.8], [s * 0.07, 0.948], [s * 0.04, 0.948], [s * 0.03, 0.8], [s * 0.024, 0.725], [s * 0.012, 0.64]])}" fill="${skin}"/>`;
      body += `<path d="M${P(s * 0.034, 0.722)} Q${P(s * 0.055, 0.736)} ${P(s * 0.078, 0.722)}" stroke="${skinD}" stroke-width="${U(0.006)}" fill="none" stroke-linecap="round"/>`;
      body += `<path d="M${P(s * 0.036, 0.944)} L${P(s * 0.074, 0.944)} Q${P(s * 0.098, 0.974)} ${P(s * 0.09, 0.999)} L${P(s * 0.036, 0.999)} Z" fill="${o.shoe || '#B98E62'}"/>`;
    }
    part('legs', -0.088, 0.67, 0.088, 0.948);
    part('feet', -0.098, 0.948, 0.098, 1);
    band(0.69, 0.76, 'joint', 'the knees');
    band(0.915, 0.972, 'joint', 'the ankles');
    band(0.972, 1, 'clip', 'the feet');
    band(1, 1.016, 'tangent', 'feet on the frame edge');
  }

  /* ---------- torso ---------- */
  if (st === 'suit') {
    body += `<path d="M${P(-0.03, 0.148)} Q${P(-0.086, 0.155)} ${P(-0.114, 0.188)} L${P(-0.1, 0.3)} L${P(-0.084, 0.39)} L${P(-0.096, 0.528)} L${P(0.096, 0.528)} L${P(0.084, 0.39)} L${P(0.1, 0.3)} L${P(0.114, 0.188)} Q${P(0.086, 0.155)} ${P(0.03, 0.148)} Z" fill="${col}"/>`;
    body += `<polygon points="${pts([[-0.027, 0.147], [0.027, 0.147], [0, 0.29]])}" fill="#F6F3EC"/>`;
    body += `<polygon points="${pts([[-0.031, 0.146], [0, 0.29], [-0.052, 0.238]])}" fill="${colD}"/>`;
    body += `<polygon points="${pts([[0.031, 0.146], [0, 0.29], [0.052, 0.238]])}" fill="${colD}"/>`;
    if (o.bowtie) {
      body += `<polygon points="${pts([[-0.022, 0.153], [0, 0.163], [-0.022, 0.175]])}" fill="${o.tie}"/><polygon points="${pts([[0.022, 0.153], [0, 0.163], [0.022, 0.175]])}" fill="${o.tie}"/>`;
    } else {
      body += `<polygon points="${pts([[0, 0.156], [0.012, 0.176], [0.007, 0.268], [0, 0.286], [-0.007, 0.268], [-0.012, 0.176]])}" fill="${o.tie}"/>`;
    }
    body += `<path d="M${P(0, 0.29)} L${P(0.004, 0.528)}" stroke="${colD}" stroke-width="${U(0.005)}" fill="none"/>`;
    body += `<circle cx="${X(0.004)}" cy="${Y(0.335)}" r="${U(0.006)}" fill="${colD}"/>`;
    if (o.flower) body += `<circle cx="${X(-0.058)}" cy="${Y(0.232)}" r="${U(0.013)}" fill="${o.flower}"/><ellipse cx="${X(-0.066)}" cy="${Y(0.246)}" rx="${U(0.012)}" ry="${U(0.006)}" fill="${LEAF[0]}"/>`;
    part('torso', -0.114, 0.15, 0.114, 0.528);
  } else {
    /* shoulders and neckline */
    body += `<path d="M${P(-0.024, 0.146)} L${P(-0.086, 0.176)} Q${P(-0.097, 0.19)} ${P(-0.09, 0.236)} L${P(0.09, 0.236)} Q${P(0.097, 0.19)} ${P(0.086, 0.176)} L${P(0.024, 0.146)} Z" fill="${skin}"/>`;
    if (st === 'gown') {
      const hw = o.skirt || 0.205;
      body += `<path d="M${P(-0.062, 0.384)} C${P(-0.1, 0.5)} ${P(-hw * 0.84, 0.8)} ${P(-hw, 0.986)} Q${P(0, 1.006)} ${P(hw, 0.986)} C${P(hw * 0.84, 0.8)} ${P(0.1, 0.5)} ${P(0.062, 0.384)} Z" fill="${col}"/>`;
      body += `<path d="M${P(0.062, 0.384)} C${P(0.1, 0.5)} ${P(hw * 0.84, 0.8)} ${P(hw, 0.986)} Q${P(hw * 0.7, 0.998)} ${P(hw * 0.5, 0.999)} C${P(hw * 0.52, 0.78)} ${P(0.075, 0.5)} ${P(0.03, 0.39)} Z" fill="${colD}" opacity=".45"/>`;
      for (const f of [-0.55, -0.18, 0.22]) {
        body += `<path d="M${P(f * 0.06, 0.4)} Q${P(f * hw * 0.55, 0.7)} ${P(f * hw * 0.9, 0.99)}" stroke="${colD}" stroke-width="${U(0.005)}" fill="none" opacity=".55"/>`;
      }
      body += `<path d="M${P(-0.09, 0.228)} Q${P(-0.045, 0.206)} ${P(0, 0.23)} Q${P(0.045, 0.206)} ${P(0.09, 0.228)} L${P(0.063, 0.392)} L${P(-0.063, 0.392)} Z" fill="${col}"/>`;
      body += `<path d="M${P(-0.063, 0.386)} L${P(0.063, 0.386)}" stroke="${o.sash || colD}" stroke-width="${U(0.012)}" fill="none"/>`;
      part('torso', -0.092, 0.15, 0.092, 0.39);
      part('skirt', -hw, 0.39, hw, 1);
      band(0.945, 1, 'clip', 'the hem of the gown');
      band(1, 1.016, 'tangent', 'the hem on the frame edge');
    } else {
      body += `<path d="M${P(-0.064, 0.384)} C${P(-0.092, 0.46)} ${P(-0.122, 0.58)} ${P(-0.128, 0.668)} Q${P(0, 0.684)} ${P(0.128, 0.668)} C${P(0.122, 0.58)} ${P(0.092, 0.46)} ${P(0.064, 0.384)} Z" fill="${col}"/>`;
      body += `<path d="M${P(0.064, 0.384)} C${P(0.092, 0.46)} ${P(0.122, 0.58)} ${P(0.128, 0.668)} Q${P(0.09, 0.676)} ${P(0.06, 0.678)} C${P(0.07, 0.56)} ${P(0.06, 0.46)} ${P(0.03, 0.39)} Z" fill="${colD}" opacity=".4"/>`;
      body += `<path d="M${P(-0.07, 0.166)} L${P(-0.09, 0.2)} L${P(-0.081, 0.3)} L${P(-0.064, 0.388)} L${P(0.064, 0.388)} L${P(0.081, 0.3)} L${P(0.09, 0.2)} L${P(0.07, 0.166)} Q${P(0, 0.236)} ${P(-0.07, 0.166)} Z" fill="${col}"/>`;
      body += `<path d="M${P(-0.064, 0.384)} L${P(0.064, 0.384)}" stroke="${colD}" stroke-width="${U(0.01)}" fill="none" opacity=".7"/>`;
      part('torso', -0.092, 0.15, 0.092, 0.39);
      part('skirt', -0.128, 0.39, 0.128, 0.68);
    }
  }

  /* ---------- arms ---------- */
  let bq = null;
  for (const s of [-1, 1]) {
    const pose = (s < 0 ? o.armL : o.armR) || 'down';
    if (pose === 'hidden') continue;
    const a = ARM_POSE[pose](s, shx);
    const sh = [s * shx, 0.192];
    body += `<path d="M${P(sh[0], sh[1])} L${P(a.el[0], a.el[1])} L${P(a.wr[0], a.wr[1])}" stroke="${sleeve}" stroke-width="${U(armW)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (a.tip) {
      if (st === 'suit') {
        const dx = a.tip[0] - a.wr[0], dy = a.tip[1] - a.wr[1], L = Math.hypot(dx, dy) || 1;
        body += `<path d="M${P(a.wr[0] - dx / L * 0.004, a.wr[1] - dy / L * 0.004)} L${P(a.wr[0] + dx / L * 0.012, a.wr[1] + dy / L * 0.012)}" stroke="#F6F3EC" stroke-width="${U(armW * 0.92)}" fill="none"/>`;
      }
      body += `<path d="M${P(a.wr[0] + (a.tip[0] - a.wr[0]) * 0.28, a.wr[1] + (a.tip[1] - a.wr[1]) * 0.28)} L${P(a.tip[0], a.tip[1] - 0.012)}" stroke="${skin}" stroke-width="${U(0.033)}" fill="none" stroke-linecap="round"/>`;
      part('hand', a.wr[0], a.wr[1] + 0.012, a.tip[0], a.tip[1], 0.017);
      band(a.wr[1] + 0.014, a.tip[1] + 0.008, 'clip', 'the hands');
    }
    part('upperArm', sh[0], sh[1], a.el[0], a.el[1], armW / 2);
    part('forearm', a.el[0], a.el[1], a.wr[0], a.wr[1], armW / 2);
    part('elbow', a.el[0], a.el[1], a.el[0], a.el[1], 0.03);
    part('wrist', a.wr[0], a.wr[1], a.wr[0], a.wr[1], 0.022);
    band(a.el[1] - 0.024, a.el[1] + 0.024, 'joint', 'the elbows');
    if (pose !== 'pocket') band(a.wr[1] - 0.02, a.wr[1] + 0.014, 'joint', 'the wrists');
    if (pose === 'bouquet') bq = { x: 0, y: 0.44, r: 0.064 };
  }
  if (bq) {
    body += bouquetSVG(cx + bq.x * h, ty + bq.y * h, bq.r * h, o.flowers || FLOWERS[0], o.R);
    part('bouquet', bq.x - bq.r, bq.y - bq.r, bq.x + bq.r, bq.y + bq.r * 1.7);
    band(bq.y - bq.r, bq.y + bq.r * 1.7, 'clip', 'the bouquet');
  }

  /* ---------- neck and head ---------- */
  body += `<polygon points="${pts([[-0.02, 0.11], [0.02, 0.11], [0.025, 0.156], [-0.025, 0.156]])}" fill="${skinD}"/>`;
  let topU = 0;
  const capRx = hs === 'bob' ? 0.056 : hs === 'crop' ? 0.0455 : 0.049;
  const capRy = hs === 'bob' ? 0.071 : hs === 'crop' ? 0.059 : 0.062;
  const capCy = hs === 'bob' ? 0.071 : hs === 'crop' ? 0.063 : 0.062;
  if (hs === 'bun') { body += `<circle cx="${X(0)}" cy="${Y(0.002)}" r="${U(0.027)}" fill="${hair}"/>`; topU = -0.025; }
  body += `<ellipse cx="${X(0)}" cy="${Y(capCy)}" rx="${U(capRx)}" ry="${U(capRy)}" fill="${hair}"/>`;
  body += `<ellipse cx="${X(0)}" cy="${Y(0.076)}" rx="${U(0.04)}" ry="${U(0.05)}" fill="${skin}"/>`;
  /* hairline */
  const yl = hs === 'crop' ? 0.036 : 0.045;
  const ax = capRx * Math.sqrt(Math.max(0, 1 - Math.pow((yl - capCy) / capRy, 2)));
  const partX = (o.part || 0) * 0.02;
  body += `<path d="M${P(-ax, yl)} A${U(capRx)} ${U(capRy)} 0 0 1 ${P(ax, yl)} Q${P(partX, yl - (hs === 'crop' ? 0.006 : -0.004))} ${P(-ax, yl)} Z" fill="${hair}"/>`;
  if (o.face !== false) {
    const e = U(0.0065);
    body += `<path d="M${P(-0.0225, 0.079)} q${e} ${-e * 0.9} ${e * 2} 0 M${P(0.0095, 0.079)} q${e} ${-e * 0.9} ${e * 2} 0" stroke="${ink}" stroke-width="${U(0.0042)}" fill="none" stroke-linecap="round"/>`;
    body += `<path d="M${P(-0.0085, 0.101)} q${U(0.0085)} ${U(0.007)} ${U(0.017)} 0" stroke="${ink}" stroke-width="${U(0.0042)}" fill="none" stroke-linecap="round"/>`;
  }
  part('head', -capRx, topU, capRx, 0.128);
  part('neck', -0.025, 0.11, 0.025, 0.156);
  band(0.03, 0.108, 'face', 'the face');
  band(0.108, 0.164, 'joint', 'the neck');

  let x0 = Infinity, x1 = -Infinity;
  for (const p of parts) { x0 = Math.min(x0, p.x0); x1 = Math.max(x1, p.x1); }
  const top = ty + topU * h;
  return {
    svg: back + body, cx, footY: o.footY, h, ty, top, style: st, parts, bands,
    y: u => ty + u * h,
    box: rect(x0, top, x1 - x0, o.footY - top),
    head: rect(cx - capRx * h, top, capRx * 2 * h, ty + 0.128 * h - top),
    hasBouquet: !!bq, poseL: o.armL || 'down', poseR: o.armR || 'down',
  };
}

/* ---- casting ---- */
function castPerson(R, style) {
  const p = {
    style, R,
    skin: R.pick(SKIN), hair: R.pick(HAIR), part: R.pick([-1, 0, 1]),
    flowers: R.pick(FLOWERS),
  };
  if (style === 'suit') {
    p.color = R.pick(SUITS);
    p.hairStyle = R.weighted([['short', 6], ['crop', 3], ['bun', 0.6], ['bob', 0.6]]);
    p.tie = R.pick(['#1E2230', '#6B2B36', '#3E5A4B', '#C9A24D', '#2A2A2E', '#8793A6']);
    p.bowtie = R.chance(0.3);
    p.flower = R.chance(0.7) ? R.pick(['#F6D5CF', '#FFFFFF', '#E9967A', '#F3E3B5']) : null;
    p.shoe = R.pick(['#19191c', '#3A2A20', '#1d1d20']);
  } else if (style === 'gown') {
    p.color = R.pick(GOWNS);
    p.hairStyle = R.weighted([['bun', 5], ['long', 4], ['bob', 2], ['short', 1]]);
    p.veil = R.chance(0.4);
    p.skirt = R.range(0.17, 0.235);
    p.sash = R.chance(0.3) ? R.pick(['#D9C7A3', '#E7B9B1', '#C9D3C4']) : null;
  } else {
    p.color = R.pick(DRESSES);
    p.hairStyle = R.weighted([['long', 5], ['bun', 3], ['bob', 3], ['short', 1]]);
    p.shoe = R.pick(['#B98E62', '#2A2A2E', '#E9D9C3', '#8C3E22']);
  }
  return p;
}

/* A single subject. poseSet limits where the hands end up:
   'waist'   – hands kept clear of a waist-level cut
   'akimbo'  – one elbow pushed out (for side-edge tests)
   'bouquet' – both hands at the waist with flowers            */
function makeSingle(o) {
  const R = o.R;
  const style = o.style || R.weighted([['suit', 4], ['gown', 4], ['dress', 3]]);
  const p = castPerson(R, style);
  let armL = 'down', armR = 'down';
  const set = o.poseSet || 'any';
  if (set === 'akimbo') { if (R.chance(0.5)) armL = 'akimbo'; else armR = 'akimbo'; if (R.chance(0.35)) armL = armR = 'akimbo'; }
  else if (set === 'bouquet' && style !== 'suit') { armL = armR = 'bouquet'; }
  else if (set === 'waist') { if (style === 'suit' && R.chance(0.5)) { if (R.chance(0.5)) armL = 'pocket'; else armR = 'pocket'; } }
  else if (set === 'any') {
    const k = R();
    if (style === 'suit') { if (k < 0.35) armL = 'pocket'; else if (k < 0.5) armR = 'pocket'; }
    else if (k < 0.45) armL = armR = 'bouquet';
  }
  const f = figure(Object.assign(p, { cx: o.cx, footY: o.footY, h: o.h, armL, armR }));
  return { svg: f.svg, people: [f] };
}

/* A couple. arrangement 'hold' = side by side holding hands,
   'close' = shoulder to shoulder.                                */
function makeCouple(o) {
  const R = o.R, h = o.h;
  const set = o.poseSet || 'any';
  const pair = o.styles || R.weighted([[['suit', 'gown'], 55], [['suit', 'dress'], 20], [['suit', 'suit'], 10], [['gown', 'gown'], 8], [['dress', 'dress'], 7]]);
  const order = R.chance(0.5) ? [pair[0], pair[1]] : [pair[1], pair[0]];
  const A = castPerson(R, order[0]), B = castPerson(R, order[1]);
  if (A.style === 'suit' && B.style === 'suit') { let g = 0; while (B.color === A.color && g++ < 8) B.color = R.pick(SUITS); }
  const short = R.range(0.9, 0.975);
  const tallIsA = A.style === 'suit' ? R.chance(B.style === 'suit' ? 0.5 : 0.8) : R.chance(B.style === 'suit' ? 0.2 : 0.5);
  const hA = tallIsA ? h : h * short, hB = tallIsA ? h * short : h;
  let arr = o.arrangement || (set === 'akimbo' ? 'close' : R.weighted([['hold', 5], ['close', 5]]));
  let aL = 'down', aR = 'down', bL = 'down', bR = 'down';
  const shA = A.style === 'suit' ? 0.094 : 0.084, shB = B.style === 'suit' ? 0.094 : 0.084;
  let gap;
  if (arr === 'hold') {
    aR = 'hold'; bL = 'hold';
    gap = (shA + 0.113) * hA + (shB + 0.113) * hB - 0.026 * h;
  } else {
    aR = 'hidden'; bL = 'hidden';
    gap = (shA + shB) * 0.5 * (hA + hB) * 0.98;
  }
  const outer = (p, side) => {
    if (set === 'akimbo') return 'akimbo';
    if (set === 'waist') return p.style === 'suit' && R.chance(0.45) ? 'pocket' : 'down';
    if (p.style === 'suit') return R.chance(0.4) ? 'pocket' : 'down';
    return 'down';
  };
  aL = outer(A, -1); bR = outer(B, 1);
  if (set === 'akimbo') { if (R.chance(0.5)) aL = 'down'; else bR = 'down'; }
  /* a bouquet needs both hands, so it only fits the shoulder-to-shoulder pose */
  if ((set === 'any' || set === 'bouquet') && arr === 'close') {
    if (B.style !== 'suit' && (set === 'bouquet' || R.chance(0.55))) { bL = bR = 'bouquet'; }
    else if (A.style !== 'suit' && set === 'bouquet') { aL = aR = 'bouquet'; }
  }
  const fA = figure(Object.assign(A, { cx: o.cx - gap / 2, footY: o.footY, h: hA, armL: aL, armR: aR }));
  const fB = figure(Object.assign(B, { cx: o.cx + gap / 2, footY: o.footY, h: hB, armL: bL, armR: bR }));
  return { svg: fA.svg + fB.svg, people: [fA, fB], arrangement: arr };
}

/* A line-up: the couple in the middle, attendants on both sides. */
function makeGroup(o) {
  const R = o.R, h = o.h, n = o.n;
  const maidCol = R.pick(DRESSES), manCol = R.pick(SUITS);
  const mid = (n - 1) / 2;
  const step = o.step || 0.215 * h;
  let svg = '';
  const people = [];
  const order = [];
  for (let i = 0; i < n; i++) order.push(i);
  /* draw outside-in so the couple overlaps the attendants */
  order.sort((a, b) => Math.abs(b - mid) - Math.abs(a - mid));
  const slots = [];
  for (const i of order) {
    const centre = Math.abs(i - mid) <= 0.5 + (n % 2 ? 0.5 : 0);
    const isCouple = n % 2 ? (i === mid || i === mid + 1) : (i === mid - 0.5 || i === mid + 0.5);
    let style;
    if (isCouple) style = i <= mid ? 'suit' : 'gown';
    else style = i < mid ? 'suit' : 'dress';
    if (o.mixed && !isCouple) style = R.chance(0.5) ? 'suit' : 'dress';
    const p = castPerson(R, style);
    if (!isCouple) p.color = style === 'suit' ? manCol : maidCol;
    if (!isCouple && style === 'suit') p.flower = null;
    const ph = h * (isCouple ? R.range(0.95, 1) : R.range(0.9, 0.99));
    let armL = 'down', armR = 'down';
    if (style !== 'suit' && R.chance(isCouple ? 0.9 : 0.6)) armL = armR = 'bouquet';
    const f = figure(Object.assign(p, { cx: o.cx + (i - mid) * step, footY: o.footY, h: ph, armL, armR }));
    slots.push({ i, f });
    void centre;
  }
  for (const s of slots) svg += s.f.svg;
  slots.sort((a, b) => a.i - b.i);
  for (const s of slots) people.push(s.f);
  return { svg, people };
}

function groupOf(people) {
  let box = people[0].box, top = Infinity, tall = people[0];
  for (const p of people) { box = rUnion(box, p.box); top = Math.min(top, p.top); if (p.h > tall.h) tall = p; }
  return { box, top, feet: people[0].footY, cx: box.x + box.w / 2, tall, h: tall.h };
}

/* ============================================================
   VENUES — the places the couple stands in.
   The world is a 3000 x 2000 "negative" (3:2). Everything is drawn
   with one consistent perspective: a camera at camH metres looking
   level at the subject, so ground lines really do converge on the
   vanishing point behind the couple.
   ============================================================ */
const WORLD = { W: 3000, H: 2000, B: 520 };

const TIMES = {
  golden: {
    sky: ['#7EA6C4', '#BFD0CB', '#F3D7A6', '#F8BE82'], sun: '#FFF4D2', glow: '#FFD38A', sunR: 62,
    far: ['#C4AE95', '#A99F7C'], tree: ['#5C7345', '#748B4E', '#495E3B'], ground: ['#B3AC62', '#8C9A4C', '#647B3A'],
    path: '#E6D3A8', water: ['#E9C99A', '#8FB1BC', '#5F8FA3'], hedge: ['#4E6A45', '#3C5639'], cloud: '#FFF3DF',
    stone: ['#EBDDC6', '#D6C4A8', '#B9A78B'], gravel: ['#E3D6BD', '#CDBC9E'],
  },
  day: {
    sky: ['#4F92D4', '#86BBE8', '#CFE7F6'], sun: '#FFFDF0', glow: '#FFFFFF', sunR: 54,
    far: ['#93B8AE', '#7CA78F'], tree: ['#3F7D4E', '#5A9A5C', '#2F6843'], ground: ['#93C772', '#6FB05B', '#4E9346'],
    path: '#EBE1C6', water: ['#BFE1F2', '#74B2DB', '#3F86B8'], hedge: ['#3E7A4A', '#2D6240'], cloud: '#FFFFFF',
    stone: ['#F0EBE0', '#DDD5C5', '#BFB7A6'], gravel: ['#E7E1D2', '#D0C9B8'],
  },
  overcast: {
    sky: ['#A7B5C0', '#C6D0D7', '#E5EAEC'], sun: null, glow: '#FFFFFF', sunR: 0,
    far: ['#9BABAA', '#879992'], tree: ['#4E6F59', '#66856A', '#3F5D4A'], ground: ['#8DA982', '#72936C', '#587A56'],
    path: '#DCD8CB', water: ['#D5DEE2', '#A3B6C0', '#7E97A4'], hedge: ['#476A52', '#375743'], cloud: '#F4F6F7',
    stone: ['#E4E2DC', '#CFCDC6', '#B0AEA7'], gravel: ['#DAD8D0', '#C3C1B8'],
  },
  dusk: {
    sky: ['#232C5A', '#51487F', '#B76A8A', '#F3A677'], sun: '#FFDCA6', glow: '#FF9E6B', sunR: 50,
    far: ['#4F4A76', '#3D3F66'], tree: ['#22364B', '#2D4459', '#1A2A3C'], ground: ['#49655A', '#35524B', '#263F3B'],
    path: '#9A8D9A', water: ['#F0A67E', '#77699C', '#3B4576'], hedge: ['#24423F', '#1B3433'], cloud: '#E9A6A0',
    stone: ['#B8A6B0', '#9A8A9C', '#756A82'], gravel: ['#9E90A0', '#83778C'],
  },
  blush: {
    sky: ['#8AA4D2', '#C5BBDC', '#F3C9C6', '#FBE2BC'], sun: '#FFF3E0', glow: '#FFC9B0', sunR: 58,
    far: ['#BAA2B6', '#A195AA'], tree: ['#55705A', '#6E8A6B', '#435C4A'], ground: ['#A3B580', '#839E66', '#65824F'],
    path: '#EBDBCA', water: ['#F6D7C5', '#B3B6D6', '#8291BE'], hedge: ['#4A6B52', '#3A5844'], cloud: '#FFF1EC',
    stone: ['#EFE2DC', '#DCCDC8', '#BDAEAB'], gravel: ['#E6DAD3', '#D0C2BC'],
  },
};
const TIME_KEYS = Object.keys(TIMES);

function makeCtx(spec) {
  const R = RNG(spec.seed);
  const { sx, gy, h, camH } = spec;
  const hy = gy - h * camH / 1.7;
  const k = h / 1.7;
  const c = { R, sx, gy, h, hy, camH, k, T: TIMES[spec.time], time: spec.time };
  c.gY = q => hy + (gy - hy) * q;               /* ground line at depth factor q (1 = subject, >1 = nearer) */
  c.pY = (q, m) => hy + (camH - m) * q * k;     /* a point m metres above the ground */
  c.pX = (q, m) => sx + m * q * k;              /* a point m metres to the side of the subject axis */
  c.qBottom = (WORLD.H + WORLD.B - hy) / (gy - hy);
  return c;
}
const gradV = (id, y0, y1, cols) =>
  `<linearGradient id="§${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${r1(y0)}" x2="0" y2="${r1(y1)}">` +
  cols.map((col, i) => `<stop offset="${Math.round(i / (cols.length - 1) * 1000) / 1000}" stop-color="${col}"/>`).join('') + `</linearGradient>`;
const mirrorX = (svg, ax) => svg + `<g transform="translate(${r1(2 * ax)} 0) scale(-1 1)">${svg}</g>`;
const X0 = -WORLD.B, XW = WORLD.W + 2 * WORLD.B;

function skyLayer(c, o) {
  const { T, R, hy } = c;
  let defs = gradV('sky', -WORLD.B * 0.4, hy, T.sky);
  let svg = `<rect x="${X0}" y="${-WORLD.B}" width="${XW}" height="${r1(hy + WORLD.B + 40)}" fill="url(#§sky)"/>`;
  if (T.sun && !o.noSun) {
    const sunX = o.sunX != null ? o.sunX : c.sx + R.sign() * R.range(700, 1300);
    const sunY = hy - R.range(90, 260);
    defs += `<radialGradient id="§glow"><stop offset="0" stop-color="${T.glow}" stop-opacity=".8"/><stop offset=".45" stop-color="${T.glow}" stop-opacity=".25"/><stop offset="1" stop-color="${T.glow}" stop-opacity="0"/></radialGradient>`;
    svg += `<circle cx="${r1(sunX)}" cy="${r1(sunY)}" r="620" fill="url(#§glow)"/><circle cx="${r1(sunX)}" cy="${r1(sunY)}" r="${T.sunR}" fill="${T.sun}"/>`;
    c.sunX = sunX;
  }
  if (!o.noClouds) {
    const n = R.int(2, 4);
    for (let i = 0; i < n; i++) {
      const x = R.range(-200, 3200), y = R.range(60, Math.max(120, hy - 420)), w = R.range(260, 520);
      const op = R.range(0.35, 0.6);
      svg += `<g fill="${T.cloud}" opacity="${r1(op)}"><ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(w)}" ry="${r1(w * 0.13)}"/><ellipse cx="${r1(x - w * 0.3)}" cy="${r1(y + w * 0.05)}" rx="${r1(w * 0.55)}" ry="${r1(w * 0.1)}"/><ellipse cx="${r1(x + w * 0.35)}" cy="${r1(y - w * 0.05)}" rx="${r1(w * 0.5)}" ry="${r1(w * 0.09)}"/></g>`;
    }
  }
  return { defs, svg };
}

/* Rolling ridge line. With ax set, the ridge is mirrored about that axis. */
function hillPath(R, baseY, amp, ax) {
  const p1 = R.range(0, 6.28), p2 = R.range(0, 6.28), w1 = R.range(1100, 1700), w2 = R.range(420, 640);
  const x1 = WORLD.W + WORLD.B, bottom = WORLD.H + WORLD.B;
  let d = `M${X0} ${bottom}`;
  for (let x = X0; x <= x1; x += 70) {
    const t = ax != null ? Math.abs(x - ax) : x;
    const y = baseY - amp * (0.62 * Math.sin(t / w1 * 6.283 + p1) + 0.38 * Math.sin(t / w2 * 6.283 + p2));
    d += ` L${x} ${r1(y)}`;
  }
  return d + ` L${x1} ${bottom} Z`;
}

function treeSVG(R, x, baseY, H, kind, cols) {
  const c0 = cols[0], c1 = cols[1], c2 = cols[2];
  if (kind === 'cypress') {
    return `<rect x="${r1(x - H * 0.012)}" y="${r1(baseY - H * 0.12)}" width="${r1(H * 0.024)}" height="${r1(H * 0.12)}" fill="#5b4636"/>` +
      `<ellipse cx="${r1(x)}" cy="${r1(baseY - H * 0.54)}" rx="${r1(H * 0.105)}" ry="${r1(H * 0.47)}" fill="${c2}"/>` +
      `<ellipse cx="${r1(x - H * 0.03)}" cy="${r1(baseY - H * 0.56)}" rx="${r1(H * 0.055)}" ry="${r1(H * 0.4)}" fill="${c0}" opacity=".7"/>`;
  }
  if (kind === 'pine') {
    let s = `<rect x="${r1(x - H * 0.02)}" y="${r1(baseY - H * 0.2)}" width="${r1(H * 0.04)}" height="${r1(H * 0.2)}" fill="#5b4636"/>`;
    for (let i = 0; i < 3; i++) {
      const y = baseY - H * (0.14 + i * 0.25), w = H * (0.24 - i * 0.05), t = H * 0.42;
      s += `<polygon points="${r1(x - w)},${r1(y)} ${r1(x + w)},${r1(y)} ${r1(x)},${r1(y - t)}" fill="${i % 2 ? c0 : c2}"/>`;
    }
    return s;
  }
  let s = `<path d="M${r1(x - H * 0.03)} ${r1(baseY)} L${r1(x - H * 0.022)} ${r1(baseY - H * 0.5)} L${r1(x + H * 0.022)} ${r1(baseY - H * 0.5)} L${r1(x + H * 0.03)} ${r1(baseY)} Z" fill="#6a5140"/>`;
  s += `<circle cx="${r1(x)}" cy="${r1(baseY - H * 0.66)}" r="${r1(H * 0.34)}" fill="${c2}"/>`;
  s += `<circle cx="${r1(x - H * 0.21)}" cy="${r1(baseY - H * 0.53)}" r="${r1(H * 0.23)}" fill="${c2}"/>`;
  s += `<circle cx="${r1(x + H * 0.22)}" cy="${r1(baseY - H * 0.55)}" r="${r1(H * 0.24)}" fill="${c0}"/>`;
  s += `<circle cx="${r1(x - H * 0.06)}" cy="${r1(baseY - H * 0.74)}" r="${r1(H * 0.25)}" fill="${c0}"/>`;
  s += `<circle cx="${r1(x - H * 0.12)}" cy="${r1(baseY - H * 0.8)}" r="${r1(H * 0.15)}" fill="${c1}" opacity=".85"/>`;
  return s;
}

function treeline(c, baseY, scale, cols, farCol, ax) {
  const { R } = c;
  let s = '';
  const from = ax != null ? ax : X0, to = WORLD.W + WORLD.B;
  for (let x = from + R.range(0, 60); x < to; x += R.range(55, 120) * scale) {
    const r = R.range(42, 78) * scale;
    const col = mix(R.pick(cols), farCol, 0.45);
    s += `<circle cx="${r1(x)}" cy="${r1(baseY - r * 0.55)}" r="${r1(r)}" fill="${col}"/>`;
  }
  return ax != null ? mirrorX(s, ax) : s;
}

/* A straight band on the ground that vanishes at the point behind the
   subject: paths, runners, docks. Xa..Xb are metres to the side. */
function groundBand(c, Xa, Xb, qFar, qNear, fill, extra) {
  return `<polygon points="${r1(c.pX(qFar, Xa))},${r1(c.gY(qFar))} ${r1(c.pX(qFar, Xb))},${r1(c.gY(qFar))} ${r1(c.pX(qNear, Xb))},${r1(c.gY(qNear))} ${r1(c.pX(qNear, Xa))},${r1(c.gY(qNear))}" fill="${fill}"${extra || ''}/>`;
}
const groundLine = (c, Xm, qFar, qNear) => [c.pX(qNear, Xm), c.gY(qNear), c.pX(qFar, Xm), c.gY(qFar)];

function fenceSVG(c, Xm, feats) {
  const { T } = c;
  let s = '';
  const wood = mix('#8a6b4c', T.far[1], 0.25), woodD = shade(wood, -0.25);
  const qs = [];
  for (let i = 0; i < 15; i++) qs.push(1 / lerp(1 / 0.24, 1 / (c.qBottom * 1.05), i / 14));
  /* rails first: thin wedges that meet at the vanishing point */
  for (const m of [0.95, 0.5]) {
    const qa = qs[0], qb = qs[qs.length - 1];
    s += `<polygon points="${r1(c.pX(qa, Xm))},${r1(c.pY(qa, m))} ${r1(c.pX(qb, Xm))},${r1(c.pY(qb, m))} ${r1(c.pX(qb, Xm))},${r1(c.pY(qb, m - 0.1))} ${r1(c.pX(qa, Xm))},${r1(c.pY(qa, m - 0.1))}" fill="${wood}"/>`;
  }
  for (const q of qs) {
    const x = c.pX(q, Xm), w = 0.11 * q * c.k;
    s += `<rect x="${r1(x - w / 2)}" y="${r1(c.pY(q, 1.12))}" width="${r1(w)}" height="${r1(c.gY(q) - c.pY(q, 1.12))}" fill="${woodD}"/>`;
  }
  feats.lines.push([c.pX(c.qBottom * 0.72, Xm), c.pY(c.qBottom * 0.72, 0.95), c.pX(1.12, Xm), c.pY(1.12, 0.95)]);
  return s;
}

function flowerDots(c, qMin, qMax, n, cols, avoidHalf) {
  const { R } = c;
  let s = '';
  for (let i = 0; i < n; i++) {
    const q = 1 / R.range(1 / qMax, 1 / qMin);
    let Xm = R.range(-9, 9) / Math.max(1, q * 0.6);
    if (avoidHalf && Math.abs(Xm) < avoidHalf) Xm = (Xm < 0 ? -1 : 1) * (avoidHalf + R.range(0, 1.2));
    const x = c.pX(q, Xm), y = c.gY(q), r = Math.min(13, 0.017 * q * c.k * R.range(0.7, 1.3));
    if (x < X0 || x > WORLD.W + WORLD.B) continue;
    s += `<circle cx="${r1(x)}" cy="${r1(y - r)}" r="${r1(r)}" fill="${R.pick(cols)}" opacity=".85"/>`;
  }
  return s;
}

/* ---------------- MEADOW ---------------- */
function envMeadow(c, o) {
  const { R, T, sx, hy } = c;
  let defs = '', back = '', mid = '';
  const feats = { horizonY: hy, lines: [] };
  const sky = skyLayer(c, { noClouds: o.sparse || o.mirror, sunX: o.mirror ? sx : o.sunX, noSun: o.noSun });
  defs += sky.defs; back += sky.svg;
  const ax = o.mirror ? sx : null;
  if (o.sparse) {
    back += `<path d="${hillPath(R, hy - 6, 14, ax)}" fill="${mix(T.far[1], T.sky[T.sky.length - 1], 0.35)}"/>`;
  } else {
    back += `<path d="${hillPath(R, hy - 70, 80, ax)}" fill="${mix(T.far[0], T.sky[T.sky.length - 1], 0.3)}"/>`;
    back += `<path d="${hillPath(R, hy - 22, 46, ax)}" fill="${T.far[1]}"/>`;
    back += treeline(c, hy + 6, 1, T.tree, T.far[1], ax);
  }
  defs += gradV('gr', hy, WORLD.H + WORLD.B * 0.6, T.ground);
  mid += `<rect x="${X0}" y="${r1(hy)}" width="${XW}" height="${r1(WORLD.H + WORLD.B - hy)}" fill="url(#§gr)"/>`;
  /* soft swells so the ground is not one flat sheet */
  if (!o.sparse) {
    for (let i = 0; i < 4; i++) {
      const q = R.range(0.3, 2.6), y = c.gY(q);
      mid += `<ellipse cx="${r1(R.range(-200, 3200))}" cy="${r1(y)}" rx="${r1(R.range(500, 1100))}" ry="${r1(18 * q)}" fill="${T.ground[2]}" opacity=".16"/>`;
    }
  }
  /* trees: kept clear of the couple's heads */
  let trees = '';
  if (!o.sparse) {
    const want = o.mirror ? 2 : (o.trees != null ? o.trees : R.int(2, 3));
    const sides = o.mirror ? [1] : null;
    for (let i = 0; i < want; i++) {
      const q = R.range(0.3, 0.78);
      const Hm = R.range(6.5, 10.5), Ht = Hm * q * c.k;
      const side = sides ? 1 : (o.treeSide || R.sign());
      const Xm = side * R.range(2.6, 6.5) / q * (o.mirror ? 0.8 + i * 0.75 : 1);
      const kind = o.treeKind || R.weighted([['round', 6], ['pine', 2], ['cypress', 1.5]]);
      trees += treeSVG(R, c.pX(q, Xm), c.gY(q), Ht, kind, T.tree);
    }
    if (o.mirror) trees = mirrorX(trees, sx);
  }
  mid += trees;
  if (o.path) {
    const w = 0.78;
    mid += groundBand(c, -w, w, 0.03, c.qBottom, T.path);
    mid += groundBand(c, -w, -w * 0.82, 0.03, c.qBottom, shade(T.path, -0.12), ' opacity=".5"');
    mid += groundBand(c, w * 0.82, w, 0.03, c.qBottom, shade(T.path, -0.12), ' opacity=".5"');
    feats.lines.push(groundLine(c, -w, 1.1, c.qBottom * 0.7), groundLine(c, w, 1.1, c.qBottom * 0.7));
    feats.lead = { half: w, name: 'path' };
  }
  if (o.fence) {
    const sides = o.fence === 2 ? [-1, 1] : [o.fence];
    for (const s of sides) mid += fenceSVG(c, s * (o.path ? 1.75 : 1.5), feats);
  }
  if (!o.sparse && !o.noFlowers) mid += flowerDots(c, 0.45, Math.min(2.6, c.qBottom), 90, ['#F6E7C6', '#F4D3C8', '#FFFFFF', '#E9C46A'], o.path ? 1.1 : 0.5);
  let frame = null;
  if (o.arbor) { const a = arborSVG(c, o.arbor); mid += a.svg; frame = a.frame; }
  if (frame) feats.frame = frame;
  if (o.mirror) feats.axisX = sx;
  return { defs, back, mid, front: '', feats };
}

/* Timber arbor or floral arch standing around the couple. */
function arborSVG(c, kind) {
  const { R, T } = c;
  const q = 0.965, half = kind === 'arch' ? 1.28 : 1.22, top = kind === 'arch' ? 2.9 : 2.72;
  const xl = c.pX(q, -half), xr = c.pX(q, half), yb = c.gY(q), yt = c.pY(q, top);
  const pw = 0.11 * q * c.k;
  const wood = kind === 'arch' ? '#F3EEE2' : mix('#9a7650', T.far[1], 0.2), woodD = shade(wood, -0.22);
  let s = '';
  if (kind === 'arch') {
    const rr = (xr - xl) / 2, yArc = c.pY(q, top - 1.28 * 0.92);
    s += `<path d="M${r1(xl)} ${r1(yb)} L${r1(xl)} ${r1(yArc)} A${r1(rr)} ${r1(yArc - yt)} 0 0 1 ${r1(xr)} ${r1(yArc)} L${r1(xr)} ${r1(yb)}" stroke="${woodD}" stroke-width="${r1(pw * 1.5)}" fill="none"/>`;
    s += `<path d="M${r1(xl)} ${r1(yb)} L${r1(xl)} ${r1(yArc)} A${r1(rr)} ${r1(yArc - yt)} 0 0 1 ${r1(xr)} ${r1(yArc)} L${r1(xr)} ${r1(yb)}" stroke="${wood}" stroke-width="${r1(pw)}" fill="none"/>`;
    /* florals around the curve, mirrored so the arch stays symmetrical */
    const pal = R.pick(FLOWERS);
    let fl = '';
    for (let i = 0; i < 26; i++) {
      const t = i / 25;
      const ang = Math.PI * (0.5 + t * 0.62);
      const px = (xl + xr) / 2 + Math.cos(ang) * rr * R.range(0.94, 1.08);
      const py = yArc - Math.sin(ang) * (yArc - yt) * R.range(0.94, 1.08);
      const r = pw * R.range(1.0, 2.1);
      fl += i % 3 === 0
        ? `<ellipse cx="${r1(px)}" cy="${r1(py)}" rx="${r1(r * 1.5)}" ry="${r1(r * 0.7)}" transform="rotate(${r1(R.range(0, 180))} ${r1(px)} ${r1(py)})" fill="${R.pick(LEAF)}"/>`
        : `<circle cx="${r1(px)}" cy="${r1(py)}" r="${r1(r)}" fill="${R.pick(pal)}"/>`;
    }
    for (let i = 0; i < 9; i++) {
      const py = lerp(yArc, yb, i / 14 + R.range(0, 0.02)), r = pw * R.range(0.9, 1.8);
      fl += `<circle cx="${r1(xl + R.range(-pw, pw))}" cy="${r1(py)}" r="${r1(r)}" fill="${i % 3 ? R.pick(pal) : R.pick(LEAF)}"/>`;
    }
    s += mirrorX(fl, (xl + xr) / 2);
  } else {
    const yBeam = yt, bh = 0.2 * q * c.k;
    s += `<rect x="${r1(xl - pw * 0.7)}" y="${r1(yBeam)}" width="${r1(pw * 1.4)}" height="${r1(yb - yBeam)}" fill="${woodD}"/><rect x="${r1(xr - pw * 0.7)}" y="${r1(yBeam)}" width="${r1(pw * 1.4)}" height="${r1(yb - yBeam)}" fill="${woodD}"/>`;
    s += `<rect x="${r1(xl - pw * 3)}" y="${r1(yBeam - bh * 0.2)}" width="${r1(xr - xl + pw * 6)}" height="${r1(bh)}" fill="${wood}"/>`;
    s += `<rect x="${r1(xl - pw * 2)}" y="${r1(yBeam + bh * 1.15)}" width="${r1(xr - xl + pw * 4)}" height="${r1(bh * 0.5)}" fill="${woodD}"/>`;
    /* drape and a floral cluster on one corner */
    const side = R.sign();
    const cxn = side < 0 ? xl : xr;
    s += `<path d="M${r1(xl)} ${r1(yBeam + bh)} Q${r1((xl + xr) / 2)} ${r1(yBeam + bh * 4.2)} ${r1(xr)} ${r1(yBeam + bh)} L${r1(xr)} ${r1(yBeam + bh * 0.4)} Q${r1((xl + xr) / 2)} ${r1(yBeam + bh * 2.6)} ${r1(xl)} ${r1(yBeam + bh * 0.4)} Z" fill="#FBF6EC" opacity=".88"/>`;
    const pal = R.pick(FLOWERS);
    for (let i = 0; i < 16; i++) {
      const px = cxn + R.range(-pw * 4, pw * 4), py = yBeam + R.range(-bh * 0.8, bh * 5), r = pw * R.range(1.2, 2.6);
      s += i % 3 === 0
        ? `<ellipse cx="${r1(px)}" cy="${r1(py)}" rx="${r1(r * 1.5)}" ry="${r1(r * 0.7)}" transform="rotate(${r1(R.range(0, 180))} ${r1(px)} ${r1(py)})" fill="${R.pick(LEAF)}"/>`
        : `<circle cx="${r1(px)}" cy="${r1(py)}" r="${r1(r)}" fill="${R.pick(pal)}"/>`;
    }
  }
  const ov = kind === 'arch' ? pw * 2.4 : pw * 3.2;
  return { svg: s, frame: rect(xl - ov, yt - ov, xr - xl + 2 * ov, yb - yt + ov) };
}

/* ---------------- GARDEN CEREMONY ---------------- */
function envGarden(c, o) {
  const { R, T, sx, hy } = c;
  let defs = '', back = '', mid = '', front = '';
  const feats = { horizonY: hy, lines: [], axisX: sx };
  const sky = skyLayer(c, { noSun: true, noClouds: true });
  defs += sky.defs; back += sky.svg;
  /* cypress row behind the hedge, mirrored */
  let cy = '';
  for (let j = 0; j < 5; j++) {
    const q = 0.5, Xm = 2.4 + j * 2.9;
    cy += treeSVG(R, c.pX(q, Xm), c.gY(q), R.range(7.4, 8.6) * q * c.k, 'cypress', T.tree);
  }
  back += mirrorX(cy, sx);
  const qh = 0.7, yTop = c.pY(qh, 2.7), yBase = c.gY(qh);
  defs += gradV('hd', yTop, yBase, [T.hedge[0], T.hedge[1]]);
  back += `<rect x="${X0}" y="${r1(yTop)}" width="${XW}" height="${r1(yBase - yTop + 4)}" fill="url(#§hd)"/>`;
  back += `<rect x="${X0}" y="${r1(yTop)}" width="${XW}" height="${r1(0.16 * qh * c.k)}" fill="${shade(T.hedge[0], 0.14)}"/>`;
  /* clipped buttresses along the hedge for rhythm */
  let but = '';
  for (let j = 0; j < 6; j++) {
    const Xm = 2.1 + j * 2.6, x = c.pX(qh, Xm), w = 0.5 * qh * c.k;
    but += `<rect x="${r1(x - w / 2)}" y="${r1(yTop)}" width="${r1(w)}" height="${r1(yBase - yTop)}" fill="${T.hedge[1]}" opacity=".55"/>`;
  }
  back += mirrorX(but, sx);
  defs += gradV('gr', yBase, WORLD.H + WORLD.B * 0.6, T.ground);
  mid += `<rect x="${X0}" y="${r1(yBase)}" width="${XW}" height="${r1(WORLD.H + WORLD.B - yBase)}" fill="url(#§gr)"/>`;
  /* topiary in urns, mirrored */
  let top = '';
  for (const Xm of [3.1, 6.4]) {
    const q = 0.98, x = c.pX(q, Xm), yb = c.gY(q), u = q * c.k;
    top += `<path d="M${r1(x - 0.26 * u)} ${r1(yb - 0.62 * u)} L${r1(x + 0.26 * u)} ${r1(yb - 0.62 * u)} L${r1(x + 0.17 * u)} ${r1(yb)} L${r1(x - 0.17 * u)} ${r1(yb)} Z" fill="${T.stone[1]}"/>`;
    top += `<rect x="${r1(x - 0.3 * u)}" y="${r1(yb - 0.68 * u)}" width="${r1(0.6 * u)}" height="${r1(0.09 * u)}" fill="${T.stone[0]}"/>`;
    top += `<circle cx="${r1(x)}" cy="${r1(yb - 1.12 * u)}" r="${r1(0.48 * u)}" fill="${T.tree[2]}"/><circle cx="${r1(x - 0.1 * u)}" cy="${r1(yb - 1.2 * u)}" r="${r1(0.3 * u)}" fill="${T.tree[0]}" opacity=".8"/>`;
  }
  mid += mirrorX(top, sx);
  { const u = 0.98 * c.k, yb = c.gY(0.98), half = 3.1 * u + 0.5 * u; feats.pair = rect(sx - half, yb - 1.62 * u, 2 * half, 1.62 * u); }
  if (o.aisle) {
    const w = 0.82, runner = mix('#FBF7EE', T.sky[T.sky.length - 1], 0.12);
    mid += groundBand(c, -w, w, 0.99, c.qBottom, runner);
    mid += groundBand(c, -w, -w * 0.9, 0.99, c.qBottom, shade(runner, -0.1));
    mid += groundBand(c, w * 0.9, w, 0.99, c.qBottom, shade(runner, -0.1));
    feats.lines.push(groundLine(c, -w, 1.08, c.qBottom * 0.62), groundLine(c, w, 1.08, c.qBottom * 0.62));
    feats.lead = { half: w, name: 'aisle' };
    let pet = '';
    for (let i = 0; i < 30; i++) {
      const q = 1 / R.range(1 / (c.qBottom * 0.9), 1 / 1.05), Xm = (w + R.range(0, 0.22));
      const r = 0.035 * q * c.k;
      pet += `<ellipse cx="${r1(c.pX(q, Xm))}" cy="${r1(c.gY(q))}" rx="${r1(r * 1.6)}" ry="${r1(r * 0.6)}" fill="${R.pick(['#F6D5CF', '#FFFFFF', '#E7A9A0'])}"/>`;
    }
    mid += mirrorX(pet, sx);
  }
  if (o.arch) { const a = arborSVG(c, 'arch'); mid += a.svg; feats.frame = a.frame; }
  if (o.chairs) {
    /* rows of seated guests seen from the back of the aisle */
    const rows = [1.2, 1.4, 1.66, 2.02, 2.5];
    const cloth = ['#3B4A5F', '#6B7A8C', '#8C6A72', '#A9B4A0', '#C9A98F', '#4F5D54', '#D9C9B8', '#7D6F8E', '#2F3A46'];
    for (const q of rows) {
      let row = '';
      const u = q * c.k, yb = c.gY(q);
      for (let j = 0; j < 7; j++) {
        const Xm = 1.42 + j * 0.64, x = c.pX(q, Xm);
        if (x > WORLD.W + WORLD.B + 200) break;
        row += `<rect x="${r1(x - 0.2 * u)}" y="${r1(yb - 0.95 * u)}" width="${r1(0.4 * u)}" height="${r1(0.5 * u)}" rx="${r1(0.05 * u)}" fill="#F4EFE4"/>`;
        row += `<rect x="${r1(x - 0.19 * u)}" y="${r1(yb - 0.46 * u)}" width="${r1(0.04 * u)}" height="${r1(0.46 * u)}" fill="#D9D2C3"/><rect x="${r1(x + 0.15 * u)}" y="${r1(yb - 0.46 * u)}" width="${r1(0.04 * u)}" height="${r1(0.46 * u)}" fill="#D9D2C3"/>`;
        if (R.chance(0.88)) {
          const cl = R.pick(cloth), hr = R.pick(HAIR);
          row += `<path d="M${r1(x - 0.25 * u)} ${r1(yb - 0.72 * u)} Q${r1(x - 0.25 * u)} ${r1(yb - 1.08 * u)} ${r1(x)} ${r1(yb - 1.08 * u)} Q${r1(x + 0.25 * u)} ${r1(yb - 1.08 * u)} ${r1(x + 0.25 * u)} ${r1(yb - 0.72 * u)} Z" fill="${cl}"/>`;
          row += `<circle cx="${r1(x)}" cy="${r1(yb - 1.22 * u)}" r="${r1(0.115 * u)}" fill="${hr}"/>`;
        }
      }
      front += mirrorX(row, sx);
    }
    feats.lines.push([c.pX(2.5, -1.42), c.pY(2.5, 1.22), c.pX(1.2, -1.42), c.pY(1.2, 1.22)], [c.pX(2.5, 1.42), c.pY(2.5, 1.22), c.pX(1.2, 1.42), c.pY(1.2, 1.22)]);
  }
  return { defs, back, mid, front, feats };
}

/* ---------------- ESTATE FACADE ---------------- */
function envEstate(c, o) {
  const { R, T, sx, hy } = c;
  let defs = '', back = '', mid = '';
  const feats = { horizonY: hy, lines: [], axisX: sx };
  const sky = skyLayer(c, { noSun: true, noClouds: true });
  defs += sky.defs; back += sky.svg;
  const q = 0.8, u = q * c.k, yb = c.gY(q), yTop = c.pY(q, 5.3);
  const stone = T.stone;
  defs += gradV('wall', yTop, yb, [stone[0], stone[1]]);
  back += `<rect x="${X0}" y="${r1(yTop)}" width="${XW}" height="${r1(yb - yTop + 6)}" fill="url(#§wall)"/>`;
  back += `<rect x="${X0}" y="${r1(yTop - 0.42 * u)}" width="${XW}" height="${r1(0.46 * u)}" fill="${stone[2]}"/>`;
  back += `<rect x="${X0}" y="${r1(yTop - 0.52 * u)}" width="${XW}" height="${r1(0.12 * u)}" fill="${stone[0]}"/>`;
  back += `<rect x="${X0}" y="${r1(yb - 0.5 * u)}" width="${XW}" height="${r1(0.5 * u + 6)}" fill="${stone[2]}" opacity=".55"/>`;
  const glass = mix('#5E7387', T.sky[0], 0.35);
  let side = '';
  for (let j = 0; j < 3; j++) {
    const Xm = 3.25 + j * 3.3, x = c.pX(q, Xm), w = 0.62 * u;
    const y1 = c.pY(q, 3.5), y2 = c.pY(q, 0.95);
    side += `<path d="M${r1(x - w)} ${r1(y2)} L${r1(x - w)} ${r1(y1)} A${r1(w)} ${r1(w)} 0 0 1 ${r1(x + w)} ${r1(y1)} L${r1(x + w)} ${r1(y2)} Z" fill="${stone[2]}"/>`;
    side += `<path d="M${r1(x - w * 0.82)} ${r1(y2 - w * 0.12)} L${r1(x - w * 0.82)} ${r1(y1)} A${r1(w * 0.82)} ${r1(w * 0.82)} 0 0 1 ${r1(x + w * 0.82)} ${r1(y1)} L${r1(x + w * 0.82)} ${r1(y2 - w * 0.12)} Z" fill="${glass}"/>`;
    side += `<path d="M${r1(x)} ${r1(y1 - w * 0.8)} L${r1(x)} ${r1(y2 - w * 0.12)} M${r1(x - w * 0.82)} ${r1((y1 + y2) / 2)} L${r1(x + w * 0.82)} ${r1((y1 + y2) / 2)}" stroke="${stone[0]}" stroke-width="${r1(0.05 * u)}" fill="none"/>`;
  }
  for (const Xm of [1.66, 4.9, 8.2]) {
    const x = c.pX(q, Xm), w = 0.2 * u;
    side += `<rect x="${r1(x - w)}" y="${r1(yTop)}" width="${r1(2 * w)}" height="${r1(yb - yTop)}" fill="${stone[0]}"/>`;
    side += `<rect x="${r1(x + w * 0.35)}" y="${r1(yTop)}" width="${r1(w * 0.65)}" height="${r1(yb - yTop)}" fill="${stone[2]}" opacity=".45"/>`;
    side += `<rect x="${r1(x - w * 1.35)}" y="${r1(yTop)}" width="${r1(2.7 * w)}" height="${r1(0.22 * u)}" fill="${stone[0]}"/><rect x="${r1(x - w * 1.35)}" y="${r1(yb - 0.3 * u)}" width="${r1(2.7 * w)}" height="${r1(0.3 * u)}" fill="${stone[0]}"/>`;
  }
  back += mirrorX(side, sx);
  if (o.door !== false) {
    const dw = 1.02 * u, y1 = c.pY(q, 2.5), xl = sx - dw, xr = sx + dw;
    const doorCol = mix('#2D3A36', T.hedge[1], 0.4);
    back += `<path d="M${r1(xl - 0.16 * u)} ${r1(yb)} L${r1(xl - 0.16 * u)} ${r1(y1)} A${r1(dw + 0.16 * u)} ${r1(dw + 0.16 * u)} 0 0 1 ${r1(xr + 0.16 * u)} ${r1(y1)} L${r1(xr + 0.16 * u)} ${r1(yb)} Z" fill="${stone[0]}"/>`;
    back += `<path d="M${r1(xl)} ${r1(yb)} L${r1(xl)} ${r1(y1)} A${r1(dw)} ${r1(dw)} 0 0 1 ${r1(xr)} ${r1(y1)} L${r1(xr)} ${r1(yb)} Z" fill="${doorCol}"/>`;
    back += `<path d="M${r1(sx)} ${r1(y1 - dw)} L${r1(sx)} ${r1(yb)}" stroke="${shade(doorCol, -0.3)}" stroke-width="${r1(0.04 * u)}"/>`;
    feats.frame = rect(xl - 0.16 * u, y1 - dw - 0.16 * u, 2 * dw + 0.32 * u, yb - y1 + dw + 0.16 * u);
  }
  defs += gradV('gr', yb, WORLD.H + WORLD.B * 0.6, [T.gravel[0], T.gravel[1], shade(T.gravel[1], -0.1)]);
  mid += `<rect x="${X0}" y="${r1(yb)}" width="${XW}" height="${r1(WORLD.H + WORLD.B - yb)}" fill="url(#§gr)"/>`;
  mid += `<rect x="${X0}" y="${r1(yb)}" width="${XW}" height="${r1(0.1 * u)}" fill="${stone[2]}" opacity=".6"/>`;
  let pots = '';
  for (const Xm of [2.25, 5.6]) {
    const qq = 0.94, x = c.pX(qq, Xm), y = c.gY(qq), uu = qq * c.k;
    pots += `<path d="M${r1(x - 0.3 * uu)} ${r1(y - 0.6 * uu)} L${r1(x + 0.3 * uu)} ${r1(y - 0.6 * uu)} L${r1(x + 0.22 * uu)} ${r1(y)} L${r1(x - 0.22 * uu)} ${r1(y)} Z" fill="${shade(stone[2], -0.12)}"/>`;
    pots += `<ellipse cx="${r1(x)}" cy="${r1(y - 1.5 * uu)}" rx="${r1(0.36 * uu)}" ry="${r1(0.95 * uu)}" fill="${T.tree[2]}"/><ellipse cx="${r1(x - 0.08 * uu)}" cy="${r1(y - 1.55 * uu)}" rx="${r1(0.2 * uu)}" ry="${r1(0.78 * uu)}" fill="${T.tree[0]}" opacity=".75"/>`;
  }
  mid += mirrorX(pots, sx);
  void R;
  return { defs, back, mid, front: '', feats };
}

/* ---------------- LAKESIDE ---------------- */
function envLake(c, o) {
  const { R, T, sx, hy } = c;
  let defs = '', back = '', mid = '';
  const feats = { horizonY: hy, lines: [] };
  const sky = skyLayer(c, { noClouds: o.sparse || o.mirror, sunX: o.mirror ? sx : o.sunX, noSun: o.noSun });
  defs += sky.defs; back += sky.svg;
  const ax = o.mirror ? sx : null;
  let shore = '';
  if (o.sparse) {
    shore += `<path d="${hillPath(R, hy - 10, 16, ax)}" fill="${mix(T.far[1], T.sky[T.sky.length - 1], 0.3)}"/>`;
  } else {
    shore += `<path d="${hillPath(R, hy - 90, 95, ax)}" fill="${mix(T.far[0], T.sky[T.sky.length - 1], 0.25)}"/>`;
    shore += `<path d="${hillPath(R, hy - 30, 44, ax)}" fill="${T.far[1]}"/>`;
    shore += treeline(c, hy + 4, 0.9, T.tree, T.far[1], ax);
  }
  back += shore;
  defs += gradV('wt', hy, WORLD.H + WORLD.B * 0.5, T.water);
  mid += `<rect x="${X0}" y="${r1(hy)}" width="${XW}" height="${r1(WORLD.H + WORLD.B - hy)}" fill="url(#§wt)"/>`;
  /* the far shore, mirrored in the water */
  mid += `<g transform="translate(0 ${r1(2 * hy)}) scale(1 -1)" opacity=".28">${shore}</g>`;
  mid += `<rect x="${X0}" y="${r1(hy - 2)}" width="${XW}" height="5" fill="${shade(T.water[0], 0.25)}" opacity=".7"/>`;
  for (let i = 0; i < 16; i++) {
    const q = R.range(0.12, c.qBottom * 0.8), y = c.gY(q), w = R.range(120, 520) * Math.max(0.5, q * 0.5);
    const x = ax != null ? sx + R.range(60, 1700) : R.range(-300, 3300);
    const ln = `<rect x="${r1(x - w / 2)}" y="${r1(y)}" width="${r1(w)}" height="${r1(Math.max(2.5, 3.2 * q))}" rx="2" fill="#fff" opacity="${r1(R.range(0.1, 0.24))}"/>`;
    mid += ax != null ? mirrorX(ln, sx) : ln;
  }
  if (o.dock) {
    const w = 1.02, qEnd = 0.86, wood = mix('#B79A76', T.far[1], 0.25), woodD = shade(wood, -0.24);
    mid += groundBand(c, -w - 0.08, w + 0.08, qEnd, c.qBottom, woodD);
    mid += groundBand(c, -w, w, qEnd + 0.004, c.qBottom, wood);
    let pl = '';
    for (let i = 0; i < 26; i++) {
      const q = 1 / lerp(1 / qEnd, 1 / (c.qBottom * 1.02), i / 25);
      pl += `<path d="M${r1(c.pX(q, -w))} ${r1(c.gY(q))} L${r1(c.pX(q, w))} ${r1(c.gY(q))}" stroke="${woodD}" stroke-width="${r1(Math.max(1.4, 2.2 * q))}" opacity=".55"/>`;
    }
    mid += pl;
    for (const s of [-1, 1]) {
      for (const q of [0.88, 1.18, 1.62, 2.3]) {
        const x = c.pX(q, s * (w + 0.06)), pw = 0.11 * q * c.k;
        mid += `<rect x="${r1(x - pw / 2)}" y="${r1(c.pY(q, 0.48))}" width="${r1(pw)}" height="${r1(c.gY(q) - c.pY(q, 0.48) + 0.4 * q * c.k)}" rx="${r1(pw * 0.2)}" fill="${woodD}"/>`;
      }
    }
    feats.lines.push(groundLine(c, -w, 1.06, c.qBottom * 0.7), groundLine(c, w, 1.06, c.qBottom * 0.7));
    feats.lead = { half: w, name: 'dock' };
  } else {
    /* grassy bank the subject stands on */
    const qB = 0.82, yB = c.gY(qB);
    defs += gradV('bk', yB, WORLD.H + WORLD.B * 0.6, [T.ground[0], T.ground[1], T.ground[2]]);
    let d = `M${X0} ${WORLD.H + WORLD.B}`;
    const p = R.range(0, 6), wv = R.range(700, 1100);
    for (let x = X0; x <= WORLD.W + WORLD.B; x += 80) {
      const t = ax != null ? Math.abs(x - ax) : x;
      d += ` L${x} ${r1(yB + 16 * Math.sin(t / wv * 6.283 + p))}`;
    }
    d += ` L${WORLD.W + WORLD.B} ${WORLD.H + WORLD.B} Z`;
    mid += `<path d="${d}" fill="url(#§bk)"/>`;
    if (!o.sparse) {
      let tr = '';
      const n = o.mirror ? 2 : R.int(1, 2);
      for (let i = 0; i < n; i++) {
        const q = R.range(0.84, 0.95), Hm = R.range(5.5, 8);
        const Xm = (o.mirror ? 1 : (o.treeSide || R.sign())) * (3.4 + i * 2.6 + R.range(0, 0.8));
        tr += treeSVG(R, c.pX(q, Xm), c.gY(q), Hm * q * c.k, R.pick(['round', 'round', 'pine']), T.tree);
      }
      mid += o.mirror ? mirrorX(tr, sx) : tr;
      mid += flowerDots(c, 0.9, Math.min(2.6, c.qBottom), 60, ['#F6E7C6', '#FFFFFF', '#E9C46A'], 0.5);
    }
  }
  if (o.mirror) feats.axisX = sx;
  return { defs, back, mid, front: '', feats };
}

/* ---------------- DOORWAY (shot from inside) ---------------- */
function envDoorway(c, o) {
  const { R, T, sx, hy } = c;
  let defs = '', back = '', mid = '';
  const feats = { horizonY: hy, lines: [] };
  const sky = skyLayer(c, { sunX: sx + R.sign() * 500 });
  defs += sky.defs; back += sky.svg;
  /* a bright garden outside */
  const yh = c.gY(0.45);
  back += treeline(c, c.gY(0.3), 2.2, T.tree, T.far[1], null);
  defs += gradV('hd', c.pY(0.45, 2.4), yh, [T.hedge[0], T.hedge[1]]);
  back += `<rect x="${X0}" y="${r1(c.pY(0.45, 2.4))}" width="${XW}" height="${r1(yh - c.pY(0.45, 2.4) + 4)}" fill="url(#§hd)"/>`;
  defs += gradV('gr', yh, c.gy + 40, [T.ground[0], T.ground[1]]);
  back += `<rect x="${X0}" y="${r1(yh)}" width="${XW}" height="${r1(WORLD.H + WORLD.B - yh)}" fill="url(#§gr)"/>`;
  back += groundBand(c, -0.9, 0.9, 0.46, 1.0, T.path);
  /* the wall and its opening */
  const u = c.k, half = 1.06 * u, yb = c.gy + 2, ySpring = c.pY(1, 1.92), rr = half;
  const off = o.offset || 0;
  const xl = sx + off - half, xr = sx + off + half;
  const wall = o.wall || R.pick(['#2B2622', '#2A2D33', '#33302B', '#2F2A30']);
  const wallL = shade(wall, 0.08);
  const open = `M${r1(xl)} ${r1(yb)} L${r1(xl)} ${r1(ySpring)} A${r1(rr)} ${r1(rr)} 0 0 1 ${r1(xr)} ${r1(ySpring)} L${r1(xr)} ${r1(yb)} Z`;
  mid += `<path fill-rule="evenodd" d="M${X0} ${-WORLD.B} H${WORLD.W + WORLD.B} V${WORLD.H + WORLD.B} H${X0} Z ${open}" fill="${wall}"/>`;
  mid += `<path d="${open}" fill="none" stroke="${wallL}" stroke-width="${r1(0.09 * u)}"/>`;
  /* floor with a pool of daylight */
  defs += gradV('fl', yb, WORLD.H + WORLD.B * 0.5, [shade(wall, 0.16), shade(wall, 0.05)]);
  mid += `<rect x="${X0}" y="${r1(yb)}" width="${XW}" height="${r1(WORLD.H + WORLD.B - yb)}" fill="url(#§fl)"/>`;
  mid += `<polygon points="${r1(xl)},${r1(yb)} ${r1(xr)},${r1(yb)} ${r1(sx + off + half * 2.6)},${r1(WORLD.H + WORLD.B)} ${r1(sx + off - half * 2.6)},${r1(WORLD.H + WORLD.B)}" fill="${T.sky[T.sky.length - 1]}" opacity=".13"/>`;
  mid += `<rect x="${X0}" y="${r1(yb - 0.14 * u)}" width="${r1(xl - X0)}" height="${r1(0.14 * u)}" fill="${wallL}"/><rect x="${r1(xr)}" y="${r1(yb - 0.14 * u)}" width="${r1(WORLD.W + WORLD.B - xr)}" height="${r1(0.14 * u)}" fill="${wallL}"/>`;
  /* furnishings: mirrored for a symmetrical room, otherwise one-sided */
  const sconce = x => `<rect x="${r1(x - 0.05 * u)}" y="${r1(c.pY(1, 2.0))}" width="${r1(0.1 * u)}" height="${r1(0.34 * u)}" fill="#B99557"/><circle cx="${r1(x)}" cy="${r1(c.pY(1, 2.08))}" r="${r1(0.36 * u)}" fill="#FFD9A0" opacity=".14"/><circle cx="${r1(x)}" cy="${r1(c.pY(1, 2.08))}" r="${r1(0.12 * u)}" fill="#FFE9C4"/>`;
  const picture = x => `<rect x="${r1(x - 0.62 * u)}" y="${r1(c.pY(1, 2.2))}" width="${r1(1.24 * u)}" height="${r1(0.9 * u)}" fill="#8C744D"/><rect x="${r1(x - 0.54 * u)}" y="${r1(c.pY(1, 2.2) + 0.08 * u)}" width="${r1(1.08 * u)}" height="${r1(0.74 * u)}" fill="${mix(T.far[0], wall, 0.35)}"/>`;
  const table = x => `<rect x="${r1(x - 0.7 * u)}" y="${r1(c.pY(1, 0.86))}" width="${r1(1.4 * u)}" height="${r1(0.08 * u)}" fill="#6B5238"/><rect x="${r1(x - 0.62 * u)}" y="${r1(c.pY(1, 0.8))}" width="${r1(0.07 * u)}" height="${r1(0.8 * u)}" fill="#59432E"/><rect x="${r1(x + 0.55 * u)}" y="${r1(c.pY(1, 0.8))}" width="${r1(0.07 * u)}" height="${r1(0.8 * u)}" fill="#59432E"/>` +
    `<ellipse cx="${r1(x)}" cy="${r1(c.pY(1, 1.36))}" rx="${r1(0.3 * u)}" ry="${r1(0.36 * u)}" fill="${T.tree[0]}"/><rect x="${r1(x - 0.1 * u)}" y="${r1(c.pY(1, 1.14))}" width="${r1(0.2 * u)}" height="${r1(0.28 * u)}" fill="#D9D2C3"/>`;
  if (o.decor === 'sym') {
    mid += mirrorX(sconce(sx + off + half + 0.85 * u) + picture(sx + off + half + 2.6 * u), sx + off);
    feats.axisX = sx;
  } else {
    const s = o.decorSide || R.sign();
    mid += picture(sx + off + s * (half + 1.6 * u)) + table(sx + off + s * (half + 1.6 * u));
    mid += sconce(sx + off - s * (half + 0.9 * u));
    const cxn = sx + off - s * (half + 2.9 * u);
    const drape = mix(wall, R.pick(['#B9A48C', '#8E9AA6', '#A88F8F']), 0.42);
    mid += `<path d="M${r1(cxn - 0.62 * u)} ${-WORLD.B} L${r1(cxn + 0.62 * u)} ${-WORLD.B} L${r1(cxn + 0.7 * u)} ${r1(yb)} L${r1(cxn - 0.7 * u)} ${r1(yb)} Z" fill="${drape}"/>`;
    for (const f of [-0.42, -0.14, 0.14, 0.42]) mid += `<path d="M${r1(cxn + f * u)} ${-WORLD.B} L${r1(cxn + f * 1.13 * u)} ${r1(yb)}" stroke="${shade(drape, -0.22)}" stroke-width="${r1(0.05 * u)}" opacity=".7"/>`;
  }
  feats.frame = rect(xl, ySpring - rr, xr - xl, yb - ySpring + rr);
  return { defs, back, mid, front: '', feats };
}

/* ---------------- FOREGROUND (out-of-focus layer) ---------------- */
function fgLayer(R, frame, kind, side, T) {
  let s = '';
  const fx = frame.x, fy = frame.y, fw = frame.w, fh = frame.h;
  const boxes = [];
  if (kind === 'florals') {
    const pal = R.pick(FLOWERS);
    const ex = side < 0 ? fx : fx + fw;
    for (let i = 0; i < 12; i++) {
      const t = i / 11;
      const x = ex - side * R.range(-0.04, 0.2) * fw * (1 - t * 0.35);
      const y = fy + fh * lerp(1.04, 0.3, t) + R.range(-0.04, 0.04) * fh;
      const r = fh * R.range(0.07, 0.13);
      s += i % 4 === 3
        ? `<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(r * 1.6)}" ry="${r1(r * 0.6)}" transform="rotate(${r1(R.range(-60, 60))} ${r1(x)} ${r1(y)})" fill="${R.pick(LEAF)}"/>`
        : `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(r)}" fill="${R.pick(pal)}"/>`;
    }
    for (let i = 0; i < 5; i++) {
      const x = fx + fw * (side < 0 ? R.range(0.1, 0.42) : R.range(0.58, 0.9)), y = fy + fh * R.range(0.95, 1.06), r = fh * R.range(0.07, 0.12);
      s += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(r)}" fill="${R.pick(pal)}"/>`;
    }
    boxes.push(side < 0 ? rect(fx, fy + fh * 0.22, fw * 0.22, fh * 0.78) : rect(fx + fw * 0.78, fy + fh * 0.22, fw * 0.22, fh * 0.78));
    return { svg: s, sigma: fh * 0.017, opacity: 0.94, boxes };
  }
  if (kind === 'leaves') {
    const ex = side < 0 ? fx : fx + fw;
    for (let i = 0; i < 16; i++) {
      const x = ex - side * R.range(-0.03, 0.34) * fw, y = fy + R.range(-0.03, 0.3) * fh * (1 - Math.abs(x - ex) / (fw * 0.5));
      const r = fh * R.range(0.06, 0.11);
      s += `<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(r * 1.7)}" ry="${r1(r * 0.62)}" transform="rotate(${r1(side * R.range(15, 70))} ${r1(x)} ${r1(y)})" fill="${R.pick([T.tree[2], T.tree[0], shade(T.tree[2], -0.2)])}"/>`;
    }
    for (let i = 0; i < 7; i++) {
      const x = ex - side * R.range(-0.02, 0.1) * fw, y = fy + R.range(0.25, 0.75) * fh, r = fh * R.range(0.05, 0.09);
      s += `<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(r * 1.7)}" ry="${r1(r * 0.62)}" transform="rotate(${r1(side * R.range(40, 90))} ${r1(x)} ${r1(y)})" fill="${R.pick([T.tree[2], T.tree[0]])}"/>`;
    }
    boxes.push(side < 0 ? rect(fx, fy, fw * 0.36, fh * 0.34) : rect(fx + fw * 0.64, fy, fw * 0.36, fh * 0.34));
    return { svg: s, sigma: fh * 0.015, opacity: 0.95, boxes };
  }
  /* 'guests': an over-the-shoulder view from the aisle */
  const cols = R.shuffle(['#2C3440', '#4A3B3F', '#3A4A44', '#5A5560']);
  const one = (cx, col, hr) => `<path d="M${r1(cx - fw * 0.2)} ${r1(fy + fh * 1.1)} L${r1(cx - fw * 0.19)} ${r1(fy + fh * 0.82)} Q${r1(cx - fw * 0.17)} ${r1(fy + fh * 0.64)} ${r1(cx)} ${r1(fy + fh * 0.63)} Q${r1(cx + fw * 0.17)} ${r1(fy + fh * 0.64)} ${r1(cx + fw * 0.19)} ${r1(fy + fh * 0.82)} L${r1(cx + fw * 0.2)} ${r1(fy + fh * 1.1)} Z" fill="${col}"/><ellipse cx="${r1(cx)}" cy="${r1(fy + fh * 0.5)}" rx="${r1(fw * 0.072)}" ry="${r1(fh * 0.135)}" fill="${hr}"/>`;
  s += one(fx + fw * 0.07, cols[0], R.pick(HAIR));
  if (side === 0) { s += one(fx + fw * 0.93, cols[1], R.pick(HAIR)); boxes.push(rect(fx, fy + fh * 0.36, fw * 0.27, fh * 0.64), rect(fx + fw * 0.73, fy + fh * 0.36, fw * 0.27, fh * 0.64)); }
  else if (side > 0) { s = one(fx + fw * 0.93, cols[0], R.pick(HAIR)); boxes.push(rect(fx + fw * 0.73, fy + fh * 0.36, fw * 0.27, fh * 0.64)); }
  else boxes.push(rect(fx, fy + fh * 0.36, fw * 0.27, fh * 0.64));
  return { svg: s, sigma: fh * 0.013, opacity: 0.97, boxes };
}

const LINENS = [['#EFE8DC', '#DDD3C2'], ['#E6E9EA', '#CCD3D6'], ['#F3E7E2', '#E2CFC8'], ['#E3E6DB', '#CBD1BE'], ['#2F3438', '#22262A']];

function sprigSVG(R, x, y, len, ang, col) {
  let s = `<g transform="rotate(${r1(ang)} ${r1(x)} ${r1(y)})">`;
  s += `<path d="M${r1(x)} ${r1(y)} Q${r1(x + len * 0.5)} ${r1(y - len * 0.08)} ${r1(x + len)} ${r1(y)}" stroke="${shade(col, -0.25)}" stroke-width="${r1(len * 0.014)}" fill="none" stroke-linecap="round"/>`;
  const n = 7;
  for (let i = 1; i <= n; i++) {
    const t = i / (n + 0.5), px = x + len * t, py = y - Math.sin(t * Math.PI) * len * 0.04;
    const r = len * lerp(0.085, 0.045, t);
    for (const sd of [-1, 1]) {
      s += `<ellipse cx="${r1(px)}" cy="${r1(py + sd * r * 0.95)}" rx="${r1(r * 0.75)}" ry="${r1(r)}" transform="rotate(${r1(sd * -28)} ${r1(px)} ${r1(py + sd * r * 0.95)})" fill="${i % 2 ? col : shade(col, 0.12)}"/>`;
    }
  }
  return s + '</g>';
}
function bokehSVG(R, n, x0, y0, x1, y1, cols, rMin, rMax) {
  let s = '';
  for (let i = 0; i < n; i++) {
    s += `<circle cx="${r1(R.range(x0, x1))}" cy="${r1(R.range(y0, y1))}" r="${r1(R.range(rMin, rMax))}" fill="${R.pick(cols)}" opacity="${r1(R.range(0.18, 0.5))}"/>`;
  }
  return s;
}
function ringSVG(x, y, rx, ry, w, rot, gold, stone) {
  const g1 = shade(gold, 0.35), g2 = shade(gold, -0.28);
  let s = `<g transform="rotate(${rot} ${r1(x)} ${r1(y)})">`;
  s += `<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="none" stroke="${g2}" stroke-width="${r1(w)}"/>`;
  s += `<ellipse cx="${r1(x)}" cy="${r1(y - w * 0.12)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="none" stroke="${gold}" stroke-width="${r1(w * 0.78)}"/>`;
  s += `<path d="M${r1(x - rx * 0.86)} ${r1(y - ry * 0.52)} A${r1(rx)} ${r1(ry)} 0 0 1 ${r1(x - rx * 0.1)} ${r1(y - ry * 1.0)}" fill="none" stroke="${g1}" stroke-width="${r1(w * 0.3)}" stroke-linecap="round"/>`;
  if (stone) {
    const sy = y - ry - w * 0.4, sw = w * 1.25;
    s += `<polygon points="${r1(x - sw)},${r1(sy - sw * 0.5)} ${r1(x - sw * 0.55)},${r1(sy - sw * 1.1)} ${r1(x + sw * 0.55)},${r1(sy - sw * 1.1)} ${r1(x + sw)},${r1(sy - sw * 0.5)} ${r1(x)},${r1(sy + sw * 0.75)}" fill="#EAF4FA"/>`;
    s += `<polygon points="${r1(x - sw)},${r1(sy - sw * 0.5)} ${r1(x + sw)},${r1(sy - sw * 0.5)} ${r1(x)},${r1(sy + sw * 0.75)}" fill="#BCD6E6"/>`;
    s += `<polygon points="${r1(x - sw * 0.3)},${r1(sy - sw * 0.5)} ${r1(x + sw * 0.3)},${r1(sy - sw * 0.5)} ${r1(x)},${r1(sy + sw * 0.75)}" fill="#F7FBFD"/>`;
  }
  return s + '</g>';
}

/* ============================================================

/* Inner markup of a frame. opts: { tilt (deg), dof (false = sharp), region (rect the blur must cover) } */

/* ============================================================

const CROPS = [

  { key: 'full', name: 'Full-length', sub: 'head to toe' },
  { key: 'threeq', name: 'Three-quarter', sub: 'ends mid-thigh' },
  { key: 'waist', name: 'Waist-up', sub: 'ends below the waist' },
  { key: 'tight', name: 'Tight', sub: 'head and shoulders' },
  { key: 'detail', name: 'Detail', sub: 'no faces, just the thing' },

const DEVICES = [
  { key: 'thirds', name: 'Rule of thirds', sub: 'subject on a third line' },
  { key: 'symmetry', name: 'Symmetry', sub: 'mirrored around the centre' },
  { key: 'lines', name: 'Leading lines', sub: 'lines run to the subject' },
  { key: 'frame', name: 'Frame in frame', sub: 'an opening around them' },
  { key: 'space', name: 'Negative space', sub: 'small subject, big empty' },

function inspectCrop(scene, crop) {

    const tol = 0.006 * p.h;

    const tightish = yb < p.y(0.34);
    for (const sd of ['left', 'right']) {
      const x = sd === 'left' ? xl : xr;
      const hit = {};
      let any = false;
      for (const part of p.parts) {
        if (part.y1 <= vy0 || part.y0 >= vy1) continue;
        if (x > part.x0 + tol && x < part.x1 - tol) { hit[part.k] = true; any = true; }
      }
      if (!any) continue;
      let f;
      if (hit.head) f = { kind: 'slice', label: 'a head', bad: true };
      else if (hit.bouquet) f = { kind: 'clip', label: 'the bouquet', bad: true };
      else if (hit.hand) f = { kind: 'clip', label: 'a hand', bad: true };
      else if (hit.elbow) f = { kind: 'joint', label: 'an elbow', bad: true };
      else if (hit.wrist) f = { kind: 'joint', label: 'a wrist', bad: true };
      else if (hit.torso || hit.skirt || hit.legs || hit.neck || hit.feet) f = { kind: 'slice', label: headIn ? 'a shoulder' : 'a person', bad: !(tightish && headIn) };

      for (const bd of p.bands) {

    f.push(Object.assign({ edge: 'top' }, t));

/* Nearest y to `ideal` that clears every joint, hand and hem by `need`. */

      let clear = Infinity;
      for (const p of people) {
        if (y > p.footY + 0.016 * p.h || y < p.top) continue;
        for (const b of p.bands) {
          const dist = y < b.y0 ? b.y0 - y : y > b.y1 ? y - b.y1 : -1;
          if (dist < clear) clear = dist;

      if (clear >= need) return y;

const headsCx = scene => {

/* Build a crop of a named type. o: { cutY, hr (headroom fraction), foot, cx, jitter } */

/* ============================================================

const rSeed = R => R.int(1, 2147483000);

/* A scene composed for one fixed frame: the subject is placed by

    time: o.time || R.pick(o.env === 'doorway' ? ['day', 'golden', 'blush', 'overcast'] : TIME_KEYS),
    sx: F.x + o.fx * F.w, gy: F.y + o.fy * F.h, h: o.frac * F.h,

/* ---------------- 1 · CALL THE CROP ---------------- */
const WHY_CROP = {
  full: 'Head to toe, with room above the head and under the feet.',
  threeq: 'The frame ends mid-thigh, clear of the knees.',
  waist: 'The frame ends just below the waist, between the elbows and the wrists.',
  tight: 'Head and shoulders. The frame ends mid-chest.',
};
function genCrop(R, force) {
  const type = force || R.pick(['wide', 'full', 'threeq', 'waist', 'tight', 'detail']);
  const done = (scene, crop, why) => ({ kind: 'pick', set: 'crop', scene, crop, answer: type, why, tag: 'crop:' + type, prompt: 'Which crop is this?' });
  if (type === 'detail') {
    const sc = detailScene(R.pick(DETAIL_KEYS), rSeed(R));
    let crop = rect(0, 0, 1500, 1000);
    if (R.chance(0.35)) { const f = sc.focus, cxx = clamp(f.x + f.w / 2, 334, 1166); crop = rect(cxx - 333.5, 0, 667, 1000); }
    return done(sc, crop, `No face in the frame. This one is about ${sc.label}.`);
  }
  const r = tryMany(80, () => {
    const couple = R.chance(0.6);
    if (type === 'wide') {
      const h = R.range(390, 470), aspect = R.chance(0.3) ? 2 / 3 : 1.5;
      const frac = R.range(Math.max(0.21, h / 1950), 0.36);
      const ch = h / frac, cw = ch * aspect;
      const gy = R.range(1400, 1520), sx = R.range(900, 2100);
      const fy = R.range(0.66, 0.8), fx = R.pick([1 / 3, 0.5, 2 / 3]) + R.range(-0.03, 0.03);
      const crop = rect(clamp(sx - fx * cw, -40, 3040 - cw), clamp(gy - fy * ch, -40, 2040 - ch), cw, ch);
      const sc = plainScene(R, { h, gy, sx, subject: { kind: couple ? 'couple' : 'single' } });
      const g = sc.group;
      if (!rContains(crop, g.box, 0.04 * cw) || g.h / ch > 0.385) return null;
      return done(sc, crop, `The ${nounOf(sc)} is only ${Math.round(g.h / ch * 100)}% of the frame height. The place is the subject.`);
    }

    const sc = plainScene(R, { subject: { kind: couple ? 'couple' : 'single', poseSet } });
    const portraitFirst = couple ? (type === 'full' && R.chance(0.65)) : (type === 'waist' ? R.chance(0.3) : R.chance(0.7));
    for (const aspect of portraitFirst ? [2 / 3, 1.5] : [1.5]) {

      if (!crop || !inBounds(crop) || !lateralOK(sc, crop, type)) continue;
      if (faultsOf(inspectCrop(sc, crop)).length) continue;
      if (classifyCrop(sc, crop) !== type) continue;

}

/* ---------------- 2 · NAME THE DEVICE / 3 · STACKED ---------------- */
const RECIPES = [
  { flags: ['thirds'], make(R) {

function genEdge(R, force) {

      const cutY = badCutY(sc, sub, R);

/* Stars for a finished run. res: { acc, pace, keepers, avg } */

/* ============================================================
   PROGRESS — saved in this browser, and synced to the player's own
   private space when the page runs inside Claude.
   ============================================================ */
const STORE_KEY = 'frame-sense:v1';
const blankProgress = () => ({ v: 1, levels: {}, tags: {}, totals: { frames: 0, keepers: 0, streak: 0 }, settings: { sound: true, openAll: false }, updated: 0 });

const Sync = { state: 'local', doc: null, busy: false, dirty: false, timer: 0 };

function loadLocal() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) P = mergeProgress(blankProgress(), JSON.parse(raw));
  } catch (e) { /* private window or blocked storage: play on without it */ }
}
function saveLocal() {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(P)); } catch (e) { /* not available */ }
}
/* Best-of merge, so two devices never undo each other. */
function mergeProgress(a, b) {
  if (!b || typeof b !== 'object') return a;
  const out = blankProgress();
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a;
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  out.settings = Object.assign({}, out.settings, a.settings, newer.settings);
  const ids = new Set(Object.keys(a.levels || {}).concat(Object.keys(b.levels || {})));
  for (const id of ids) {
    const x = (a.levels || {})[id] || {}, y = (b.levels || {})[id] || {};
    const pick = (f, better) => (x[f] == null ? y[f] : y[f] == null ? x[f] : better(x[f], y[f]));
    out.levels[id] = {
      stars: Math.max(x.stars || 0, y.stars || 0), plays: Math.max(x.plays || 0, y.plays || 0),
      acc: pick('acc', Math.max), pace: pick('pace', Math.min), score: pick('score', Math.max), keepers: pick('keepers', Math.max),
    };
  }
  const tags = new Set(Object.keys(a.tags || {}).concat(Object.keys(b.tags || {})));
  for (const t of tags) {
    const x = (a.tags || {})[t], y = (b.tags || {})[t];
    out.tags[t] = !x ? y : !y ? x : ((y.n || 0) > (x.n || 0) ? y : x);

}

}
async function pushRemote() {

  try { await Sync.doc.set(JSON.parse(JSON.stringify(P))); Sync.state = 'synced'; }
  catch (e) { Sync.state = 'local'; }

}
/* Inside Claude the page can keep each player's progress in their own private documents. */
async function connectSync() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const doc = db.doc('data/users/' + uid + '/progress');
    const snap = await doc.get();
    const before = JSON.stringify(P.levels) + JSON.stringify(P.totals);
    if (snap && snap.exists) P = mergeProgress(P, snap.data());
    Sync.doc = doc; Sync.state = 'synced';
    saveLocal();
    const after = JSON.stringify(P.levels) + JSON.stringify(P.totals);
    if (!snap || !snap.exists || before !== after || JSON.stringify(snap.data().levels || {}) !== JSON.stringify(P.levels)) { Sync.dirty = true; pushRemote(); }
    if (typeof onSyncChange === 'function') onSyncChange();

}

/* ---- records ---- */
const levelRec = id => P.levels[id] || { stars: 0, plays: 0 };
const isOpen = level => P.settings.openAll || level.n === 1 || levelRec(LEVELS[level.n - 2].id).stars > 0;
const nextLevel = () => LEVELS.find(l => levelRec(l.id).stars === 0) || null;
function recordTag(tag, ok) {
  const t = P.tags[tag] || (P.tags[tag] = { n: 0, miss: 0, last: '' });
  t.n++; if (!ok) t.miss++;

}
/* Miss rate over the most recent attempts at each kind of frame. */
function weakSpots(limit) {
  const out = [];
  for (const tag of Object.keys(P.tags)) {
    const t = P.tags[tag];
    if (!t.last || t.last.length < 3) continue;
    const miss = t.last.split('').filter(c => c === '0').length / t.last.length;
    if (miss >= 0.2) out.push({ tag, miss, n: t.last.length });
  }
  out.sort((a, b) => b.miss - a.miss || b.n - a.n);

}
function recordRun(level, res, stars) {
  const r = P.levels[level.id] || (P.levels[level.id] = { stars: 0, plays: 0 });
  r.plays = (r.plays || 0) + 1;
  r.stars = Math.max(r.stars || 0, stars);

  if (res.pace != null && res.quick >= 5) r.pace = r.pace == null ? res.pace : Math.min(r.pace, res.pace);

}

/* ============================================================
   SOUND — a shutter for every answer. Synthesised, so there is
   nothing to download. Starts only after the player's first tap.
   ============================================================ */
const Sound = (() => {

    try {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
      if (ctx.state === 'suspended') ctx.resume();

    } catch (e) { return null; }
  }

    const n = Math.max(1, Math.floor(c.sampleRate * dur)), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.4);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = gain;
    s.connect(f); f.connect(g); g.connect(c.destination);

  }

    shutter() { if (on()) { burst(0.028, 2800, 1.1, 0.42); burst(0.045, 1500, 0.9, 0.3, 0.05); } },
    miss() { if (on()) { tone(165, 0.17, 0.2, 0, 'triangle'); } },
    pass() { if (on()) { tone(660, 0.13, 0.13); tone(880, 0.13, 0.13, 0.1); tone(1320, 0.26, 0.12, 0.2); } },
    fail() { if (on()) { tone(330, 0.18, 0.13, 0, 'triangle'); tone(247, 0.3, 0.13, 0.14, 'triangle'); } },
    wake: ensure,
  };
})();

/* ---------------- results ---------------- */
function resultWords(level, res, stars) {
  const k = `${res.keepers} of ${res.total} keepers`;
  if (level.practice) return ['Practice done.', `${k}${res.pace != null ? ' at ' + secs(res.pace) + ' a frame' : ''}.`];
  if (level.mode === 'make') {
    if (!stars) return ['Not yet.', `Your crops averaged ${res.avg} of 100. The pass mark is ${level.pass}.`];
    return [stars === 3 ? 'Three stars.' : 'Passed.', `Your crops averaged ${res.avg} of 100.${stars === 1 ? ' 85 earns the second star.' : stars === 2 ? ' 93 earns the third.' : ''}`];
  }
  if (level.mode === 'timed') {
    if (!stars) return ['Not yet.', `${res.keepers} keepers at ${pct(res.acc)}. You need ${level.need} at ${pct(level.pass)}.`];
    return [stars === 3 ? 'Three stars.' : 'Passed.', `${res.keepers} keepers in ${level.seconds} seconds at ${pct(res.acc)}.${stars === 1 ? ` ${level.need + 4} earns the second star.` : stars === 2 ? ` ${level.need + 8} at 90% earns the third.` : ''}`];
  }
  if (level.mode === 'exam') {
    if (!stars) return ['Not yet.', `${k} (${pct(res.acc)}). The pass mark is ${pct(level.pass)}.`];
    return [stars === 3 ? 'Three stars.' : 'Passed.', `${k} (${pct(res.acc)}).${stars === 1 ? ' 90% earns the second star.' : stars === 2 ? ' 95% earns the third.' : ''}`];
  }
  if (!stars) return ['Not yet.', `${k} (${pct(res.acc)}). The pass mark is ${pct(level.pass)}.`];
  if (stars === 1) return ['Passed.', `${k} at ${secs(res.pace)} a frame. Get under ${secs(level.pace)} for the second star.`];
  if (stars === 2) return ['Passed, on pace.', `${k} at ${secs(res.pace)} a frame. 95% at this pace earns the third star.`];
